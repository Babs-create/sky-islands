function extraInteract(bd){
  let best=null;
  if(G.fishing) return {kind:'extra',label:G.fishing.state==='bite'?'REEL IN!':'Reel in',fn:reelIn,d:0};
  for(const c of critters){ const d=dist(c.x,c.y,P.x,P.y); if(d<bd){ const pd=PETS[c.type]; const have=cnt(pd.treat); bd=d;
    best={kind:'extra',label: have>=pd.need?`Feed ${pd.need} ${ITEMS[pd.treat].i} to befriend the ${pd.n}`:`${pd.n} wants ${pd.need} ${ITEMS[pd.treat].n} (${have}/${pd.need})`,fn:()=>tameCritter(c),d}; } }
  const px=Math.floor(P.x),py=Math.floor(P.y);
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){ const s=structAt(px+dx,py+dy); if(s&&s.type==='board'){ const d=dist(s.x+.5,s.y+.5,P.x,P.y); if(d<bd){bd=d;best={kind:'extra',label:'Read the Bounty Board',fn:()=>{G.boardVillage=s.data.village;openPanel('bounty');},d};} } }
  if(!best && P.inv.fishing_rod>0){
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){ const x=px+dx,y=py+dy; if(!inB(x,y)) continue; const t=tiles[idx(x,y)]; if(dist(x+.5,y+.5,P.x,P.y)>1.6) continue;
      if(t===T.WATER){ return {kind:'extra',label:'Fish in the pond',fn:()=>startFishing(x+.5,y+.5,'pond'),d:9}; }
      if(t===T.VOID&&!structAt(x,y)&&isLand(px,py)){ best={kind:'extra',label:'Cast your line into the clouds',fn:()=>startFishing(x+.5+dx*.6,y+.5+dy*.6,'sky'),d:9}; } }
  }
  return best;
}

// ---------- bounty boards
function bountiesFor(vkey){
  const v=villages.find(v=>v.key===vkey); const isl=islands[v.isl]; const t=Math.max(1,isl.tier);
  const rr=mulberry32((hash2(isl.id*31,G.day*17)*1e9)|0); const out=[];
  const enemyBy={1:['scrapper','slinger'],2:['thornback','raider'],3:['sporeling','brute','shaman'],4:['golem','shaman','stormguard'],5:['stormguard','golem']};
  const resBy={meadow:['wood','stone','fiber','berries'],bloom:['petal','berries','wood'],fungal:['glowcap','iron','wood'],crystal:['crystal','iron','stone'],storm:['iron','stone','crystal']};
  for(let i=0;i<3;i++){ const kind=['kill','gather','fish','camp','balloon','night'][Math.floor(rr()*(i===2?6:4))]; let b;
    if(kind==='kill'){ const e=enemyBy[t][Math.floor(rr()*enemyBy[t].length)]; const n=3+Math.floor(rr()*4); b={type:'kill',enemy:e,n,text:`Defeat ${n} ${ENEMIES[e].n}s`}; }
    else if(kind==='gather'){ const it=resBy[isl.biome][Math.floor(rr()*resBy[isl.biome].length)]; const n=10+Math.floor(rr()*16); b={type:'gather',item:it,n,text:`Deliver ${n} ${ITEMS[it].n}`}; }
    else if(kind==='fish'){ const n=3+Math.floor(rr()*4); b={type:'fish',n,text:`Catch ${n} fish`}; }
    else if(kind==='camp'){ b={type:'camp',n:1,text:'Clear any enemy camp'}; }
    else if(kind==='balloon'){ b={type:'balloon',n:1,text:'Pop a treasure balloon'}; }
    else { const n=5+Math.floor(rr()*5); b={type:'kill',enemy:'gloom',n,text:`Defeat ${n} Gloomlings at night`}; }
    const mult=b.type==='camp'?3:b.type==='balloon'?2:1;
    b.coins=Math.round((25+t*20)*mult*(1+rr()*.4)); b.xp=Math.round((30+t*25)*mult); b.id=`${vkey}_${G.day}_${i}`; b.village=v.name; out.push(b); }
  return out;
}
function acceptBounty(b){ if(G.ext.bounties.length>=3){ toast('You can carry 3 bounties at once.'); return; } if(G.ext.bountyTaken[b.id]) return;
  G.ext.bountyTaken[b.id]=1; G.ext.bounties.push(Object.assign({},b,{p:0})); sfx('ready'); toast(`📋 Bounty accepted: ${b.text}`); renderPanel(); }

  G.ext.bounties.splice(i,1); give('coins',b.coins); gainXP(b.xp); G.ext.bountiesDone++; sfx('quest'); toast(`📋 Bounty complete! +${b.coins} 🪙, +${b.xp} XP`,'gold'); extraEvent('bountydone',{}); renderPanel(); saveGame(); }
function renderBounty(t,tabs,body){
  t.textContent='Bounty Board'; const v=villages.find(v=>v.key===G.boardVillage); const list=bountiesFor(G.boardVillage);
  let h=`<div class="stn">${v?v.name:''} · New bounties every day. You can carry up to 3. Turn them in at any village board.</div><h3>Today's bounties (Day ${G.day})</h3><div class="grid">`;
  for(const b of list){ const taken=G.ext.bountyTaken[b.id]; h+=`<div class="card"><div class="big">📋</div><div style="flex:1"><div class="nm">${b.text}</div><div class="ds">Reward: ${b.coins} 🪙 · ${b.xp} XP</div><button class="btn" ${taken||G.ext.bounties.length>=3?'disabled':''} onclick='acceptBounty(${JSON.stringify(b)})'>${taken?'Taken':'Accept'}</button></div></div>`; }

function nearestUnvisitedVillage(){ const s=new Set(G.ext.visited); let b=null,bd=1e9; for(const v of villages){ if(s.has(v.isl)) continue; const d=dist(v.x,v.y,P.x,P.y); if(d<bd){bd=d;b=v;} } return b?{x:b.x,y:b.y}:null; }
function nearestShrine(){ let b=null,bd=1e9; for(const sh of shrines){ if(shrineAttuned(sh)) continue; const d=dist(sh.x,sh.y,P.x,P.y); if(d<bd){bd=d;b=sh;} } return b?{x:b.x,y:b.y}:null; }
function nearestFort(){ let b=null,bd=1e9; for(const f of forts){ if(f.cleared||f.ground) continue; const d=dist(f.x,f.y,P.x,P.y); if(d<bd){bd=d;b=f;} } return b?{x:b.x,y:b.y}:null; }
// ===================== DIAMONDS & THE DIAMOND SWORD =====================
// Diamond ore is rare: only on dangerous (4-5 star) isles and in the far east of the Gloomlands. Needs an Iron Pickaxe.
ITEMS.crystal.i='🧊';
Object.assign(ITEMS,{
  diamond:{n:'Diamond',i:'💎',sell:40},
  diamond_sword:{n:'Diamond Sword',i:'🗡️',gear:'weapon',dmg:70},
});
WEAPON_COL.diamond_sword='#b9f6ff';
DECO.diamond={hp:28,tool:'pick',tier:3,drops:{diamond:[1,1],crystal:[0,1]},solid:true,regrow:900};
RECIPES.push({id:'diamond_sword',st:'forge',cost:{diamond:10,crystal:15,iron:20,stardust:5},minLvl:15});
function genDiamonds(){
  const r=mulberry32(SEED+9001);
  const place=(isl,tries)=>{ for(let t=0;t<tries;t++){ const a=r()*6.283, d=r()*isl.r*.8; const x=Math.floor(isl.x+Math.cos(a)*d), y=Math.floor(isl.y+Math.sin(a)*d);
      if(!inB(x,y)||islandOf[idx(x,y)]!==isl.id||!isLand(x,y)||tiles[idx(x,y)]===T.PATH||structAt(x,y)||voidNeighbor(x,y)) continue; const old=decoAt(x,y); if(old) removeDeco(old); return addDeco('diamond',x,y); } return null; };
  for(const isl of islands){ if(isl.story||isl.village||isl.kind==='ground'||isl.tier<4) continue; if(r()<(isl.tier>=5?.4:.22)) place(isl,20); }
  if(groundIsl){ for(let k=0;k<30;k++){ const x=Math.floor(GX+GRX*(.1+r()*.8)), y=Math.floor(GY+(r()-.5)*GRY*1.6); if(!inB(x,y)||islandOf[idx(x,y)]!==groundIsl.id||!isLand(x,y)||tiles[idx(x,y)]===T.RUIN||structAt(x,y)||voidNeighbor(x,y)) continue; const old=decoAt(x,y); if(old) removeDeco(old); addDeco('diamond',x,y); } }
}
function drawDiamondOre(d){ const [x,y]=S(d.x+.5,d.y+.5); ell(ctx,x,y+1,14,6,'rgba(0,0,0,.22)');
  poly(ctx,[x-13,y,x-9,y-13,x+2,y-18,x+12,y-9,x+13,y,x,y+4],'#5e6070'); poly(ctx,[x-9,y-13,x+2,y-18,x+12,y-9,x+1,y-6],'#7a7c8c');
  const gems=[[-5,-9,5],[4,-12,6],[7,-4,4]]; for(const [ox,oy,s] of gems){ poly(ctx,[x+ox,y+oy-s,x+ox+s*.8,y+oy,x+ox,y+oy+s*.7,x+ox-s*.8,y+oy],'#c8f8ff','#ffffff',1); poly(ctx,[x+ox,y+oy-s,x+ox+s*.8,y+oy,x+ox,y+oy],'#e8feff'); }
  if(Math.sin(G.t*3+d.x)>.92) circ(ctx,x+4,y-16,2.2,'#fff'); }
// ===================== MAIN =====================
function rle(arr){ let out=[],cur=arr[0],n=0; for(let i=0;i<arr.length;i++){ if(arr[i]===cur) n++; else { out.push(n); cur=arr[i]; n=1; } } out.push(n); return {f:arr[0],r:out}; }
function unrle(o,arr){ let v=o.f,p=0; for(const n of o.r){ arr.fill(v,p,p+n); p+=n; v=v?0:1; } }

function saveGame(manual){
  if(G.mode!=='play') return;
  try{
    const sp=P.spawn!=null&&structs[P.spawn]&&structs[P.spawn].alive?[structs[P.spawn].x,structs[P.spawn].y]:null;
    const data={v:1,P:{x:P.x,y:P.y,hp:P.hp,maxHp:P.maxHp,lvl:P.lvl,xp:P.xp,coins:P.coins,inv:P.inv,spawn:sp},
      G:{ext:G.ext,time:G.time,day:G.day,built:G.built,anchor:G.anchor,bossDead:G.bossDead,raidDone:G.raidDone,flags:G.flags,tracked:G.tracked,stats:G.stats,hintShown:G.hintShown,victory:G.victory},
      qs, camps:camps.map(c=>({k:c.key,cl:c.cleared,cd:c.chiefDead})),
      structs:structs.filter(s=>s.alive&&s.owner==='player').map(s=>[s.type,s.x,s.y,Math.round(s.hp),s.data]),
      pk:pickups.filter(p=>p.taken).map(p=>p.id), ex:rle(explored), exW:W};
    localStorage.setItem(SAVE_KEY,JSON.stringify(data));
    if(manual) toast('💾 Game saved.');
  }catch(e){ if(manual) toast('Could not save in this browser.'); }
}
function hasSave(){ try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; } }
function freshWorld(){ genWorld(); chunkCache.clear(); enemies=[]; projectiles=[]; particles=[]; texts=[]; effects=[]; regrowQ=[]; lightCache=null; mapDirty=true; explored.fill(0); }
function resetG(){ Object.assign(G,{time:.08,day:1,buildMode:false,buildSel:0,built:{},anchor:false,bossDead:false,boss:null,raid:{active:false,wave:0},raidDone:{},flags:{},tracked:null,dead:false,victory:false,nightT:5,campT:0,questT:0,autosaveT:45,hintShown:{},stats:{kills:0,built:0,bridges:0},fishing:null,balloonT:90,meteorNight:-1,meteorRoll:-1}); G.ext=freshExt(); }
function newGame(){
  freshWorld(); resetG(); resetPlayer(); qs={};
  initCampEnemies();
  startGameUI();
  startQuest(QMAP.t1);
  toast('Welcome to the Shattered Isles. Press <kbd>Esc</kbd> any time for controls.');
  saveGame();
}
function loadGame(){
  let d; try{ d=JSON.parse(localStorage.getItem(SAVE_KEY)); }catch(e){ d=null; }
  if(!d){ newGame(); return; }
  freshWorld(); resetG(); resetPlayer();
  Object.assign(P,d.P); P.spawn=null; P.alive=true; Object.assign(G,d.G); G.boss=null; G.raid={active:false,wave:0};
  G.ext=Object.assign(freshExt(),G.ext||{}); G.stats.bridges=G.stats.bridges||0; G.fishing=null;
  qs=d.qs||{};
  for(const c of d.camps||[]){ const camp=camps.find(x=>x.key===c.k); if(!camp) continue; camp.chiefDead=c.cd; if(c.cl){ camp.cleared=true; removeStruct(camp.totem); if(!G.flags['chest_'+camp.key]){ const t=camp.tier; addStruct('chest',camp.totem.x,camp.totem.y,'world',{loot:{coins:Math.round((10+t*18)*camp.mult)},camp:camp.key}); } } }
  for(const f of forts){ const k=camps.find(c=>c.key===f.keep); if(k&&k.cleared) f.cleared=true; }
  for(const [type,x,y,hp,data] of d.structs||[]){ if(!STRUCTS[type]) continue; const s=addStruct(type,x,y,'player',data||{}); s.hp=hp; if(d.P.spawn&&type==='bed'&&x===d.P.spawn[0]&&y===d.P.spawn[1]) P.spawn=s.id; }
  for(const id of d.pk||[]){ const p=pickups.find(p=>p.id===id); if(p) p.taken=true; }
  for(const s of structs){ if(s.alive&&s.type==='chest'&&s.data.special&&G.flags[s.data.special]) removeStruct(s); }
  if(G.anchor) buildSkybridge();
  for(const k of ['g1','g2','g3','g4','g5']) if(!QMAP[k]) delete qs[k];
  if(d.ex){ const ew=d.exW||860; if(ew===W) unrle(d.ex,explored); else { const tmp=new Uint8Array(ew*ew); unrle(d.ex,tmp); for(let y=0;y<Math.min(ew,W);y++) for(let x=0;x<Math.min(ew,W);x++) explored[y*W+x]=tmp[y*ew+x]; } }
  rebuildGloom();
  initCampEnemies();
  if(collides(P.x,P.y,.28)){ const p=nearestWalkable(P.x,P.y,6); P.x=p.x; P.y=p.y; }
  startGameUI(); toast(`Welcome back, Skywright. Day ${G.day}.`);
}
function startGameUI(){
  G.mode='play'; $('title').classList.add('hidden'); $('hud').classList.remove('hidden'); closeOverlay(); closePanel(); closeDialog();
  snapCamera(); updateTracker(); updateBuildBar(); mapDirty=true;
}
function quitToTitle(){ saveGame(); closePanel(); G.mode='title'; G.buildMode=false; $('hud').classList.add('hidden'); $('title').classList.remove('hidden'); $('bContinue').classList.toggle('hidden',!hasSave()); P.alive=false; }

function snapCamera(){ cam.x=isoX(P.x,P.y); cam.y=isoY(P.x,P.y)-20; }
function followCam(dt){ const tx=isoX(P.x,P.y), ty=isoY(P.x,P.y)-20; const k=Math.min(1,dt*7); cam.x+=(tx-cam.x)*k; cam.y+=(ty-cam.y)*k; }
let titleA=0;
function titleCam(dt){ titleA+=dt*.05; const h=islandByKey.home; const x=h.x+Math.cos(titleA)*18, y=h.y+6+Math.sin(titleA)*18; cam.x=isoX(x,y); cam.y=isoY(x,y); }

let duskWarned=-1, prevDay=1;
function update(dt){
  G.time+=dt/DAY_LEN; if(G.time>=1){ G.time-=1; G.day++; }
  if(G.day!==prevDay){ prevDay=G.day; toast(`☀ Day ${G.day} begins.`); saveGame(); }
  if(G.time>.6&&duskWarned!==G.day){ duskWarned=G.day; if(G.day===1) toast('🌇 Dusk. The first night is calm, but from tomorrow <b>Gloomlings</b> hunt in the dark. Torches and campfires burn them.'); else if(G.day===2) toast('🌙 Night falls. Stay near light or keep moving!','red'); }
  updatePlayer(dt); updateNPCs(dt); updateEnemies(dt); updateProjectiles(dt); updateEffects(dt); updateStructs(dt);
  updateCamps(dt); updateNight(dt); updateRaid(dt); updateBossTrigger(); updateRegrow(dt); updateExtras(dt); updateGround(dt); updateShrines(dt);
  for(const d of shaking) d.shake-=dt; shaking=shaking.filter(d=>d.shake>0);
  G.questT-=dt; if(G.questT<=0){ G.questT=.35; checkQuests(); updateTracker(); }
  G.autosaveT-=dt; if(G.autosaveT<=0){ G.autosaveT=45; saveGame(); }
}
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; G.t+=dt;
  if(G.mode==='play'){ if(!isPaused()) update(dt); followCam(dt); updateHUD(dt); }
  else titleCam(dt);
  shake=Math.max(0,shake-dt*2.5); flashRed=Math.max(0,flashRed-dt*3);
  try{ render(); }catch(err){ console.error(err); }
  requestAnimationFrame(frame);
}
// boot
resize(); genWorld(); resetPlayer(); P.alive=false; for(let i=0;i<W*W;i++) explored[i]=0;
prevDay=1;
$('bContinue').classList.toggle('hidden',!hasSave());
$('bNew').onclick=()=>{ if(!hasSave()){ newGame(); prevDay=G.day; return; }
  showOverlay(`<h2>Start over?</h2><p>Your saved progress will be replaced.</p><div class="btns"><button class="btn" id="oYes">New game</button><button class="btn alt" id="oNo">Cancel</button></div>`);
  $('oYes').onclick=()=>{ closeOverlay(); newGame(); prevDay=G.day; duskWarned=-1; }; $('oNo').onclick=closeOverlay; };
$('bContinue').onclick=()=>{ loadGame(); prevDay=G.day; duskWarned=G.time>.6?G.day:-1; };
$('bHelp').onclick=()=>{ showOverlay(`<h2>How to Play</h2><p>You are a <b>Skywright</b>: a builder in a world shattered into floating islands. Gather, craft, build bridges between isles, help villagers, clear bandit camps, and recover four Sky Shards to face the Tempest Warlord. The tutorial walks you through everything step by step.</p>${helpHTML()}<div class="btns"><button class="btn" id="oClose">Got it</button></div>`); $('oClose').onclick=closeOverlay; };
window.addEventListener('beforeunload',()=>saveGame());
requestAnimationFrame(frame);
</script></body></html>
