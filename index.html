<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skywright: The Shattered Isles</title>
<style>
:root{--panel:#16203a;--panel2:#1f2c4d;--line:#3a4c7a;--gold:#f2c94c;--txt:#eef2ff;--dim:#9aa8cc;--good:#6fe08a;--bad:#ff7a7a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0c1228;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;display:block;cursor:crosshair}
.hidden{display:none!important}
kbd{display:inline-block;min-width:20px;padding:1px 6px;margin:0 1px;border-radius:5px;background:#2b3a64;border:1px solid #4d64a0;border-bottom-width:3px;font:600 12px system-ui;color:#fff;text-align:center}
button{font:inherit;cursor:pointer}
#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{position:absolute}
#stats{top:12px;left:12px;width:250px;background:rgba(14,20,40,.78);border:1px solid var(--line);border-radius:12px;padding:10px 12px;backdrop-filter:blur(4px)}
#stats .row{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-bottom:6px}
.bar{position:relative;height:16px;background:#0a0f20;border-radius:8px;overflow:hidden;border:1px solid #2a3760;margin-bottom:5px}
.bar>div{height:100%;transition:width .15s}
#hpfill{background:linear-gradient(90deg,#e04848,#ff7a5a)}
#xpfill{background:linear-gradient(90deg,#7a5ae0,#b48aff)}
.bar.xp{height:7px}
.bar span{position:absolute;inset:0;font:700 11px system-ui;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 2px #000}
#gear{display:flex;gap:6px;font-size:12px;color:var(--dim);flex-wrap:wrap;margin-top:4px}
#gear span{background:#0d1530;border-radius:6px;padding:2px 6px}
#clock{top:122px;left:12px;background:rgba(14,20,40,.78);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px}
#mapwrap{top:12px;right:12px;width:200px;text-align:center}
#minimap{pointer-events:auto;cursor:zoom-in;width:200px;height:200px;border-radius:50%;border:3px solid #3a4c7a;background:rgba(10,16,36,.85);box-shadow:0 4px 18px rgba(0,0,0,.4)}
#islname{margin-top:4px;font-size:12px;font-weight:700;color:#dfe8ff;text-shadow:0 1px 3px #000}
#tracker{top:248px;right:12px;width:260px;background:rgba(14,20,40,.78);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;pointer-events:auto;cursor:pointer}
#tracker .qt{font-weight:800;color:var(--gold);margin-bottom:4px;font-size:14px}
#tracker .qk{font-size:10px;letter-spacing:.08em;color:var(--dim);font-weight:700}
#tracker .ob{margin:3px 0;color:#d8e0ff}
#tracker .ob.done{color:var(--good);text-decoration:line-through;opacity:.8}
#tracker .other{margin-top:8px;padding-top:6px;border-top:1px solid #2a3760;color:var(--dim);font-size:12px}
#hint{top:12px;left:50%;transform:translateX(-50%);max-width:560px;background:linear-gradient(180deg,rgba(40,52,96,.95),rgba(24,32,64,.95));border:2px solid var(--gold);border-radius:14px;padding:10px 16px;font-size:14px;line-height:1.55;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.45)}
#hint .ht{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--gold);margin-bottom:2px}
#res{bottom:12px;left:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:44vw}
#res .chip{background:rgba(14,20,40,.82);border:1px solid var(--line);border-radius:10px;padding:4px 9px;font-weight:700;font-size:14px}
#action{bottom:96px;left:50%;transform:translateX(-50%);background:rgba(14,20,40,.88);border:1px solid var(--gold);border-radius:10px;padding:6px 12px;font-weight:700;font-size:14px}
#buildbar{bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:rgba(14,20,40,.9);border:1px solid var(--gold);border-radius:14px;padding:6px;pointer-events:auto;max-width:96vw;overflow-x:auto}
#buildbar .bi{position:relative;width:56px;min-width:56px;height:62px;border-radius:10px;background:#1c2850;border:2px solid transparent;text-align:center;cursor:pointer;padding-top:4px}
#buildbar .bi .ic{font-size:24px;line-height:28px}
#buildbar .bi .nm{font-size:9px;font-weight:700;color:#cfd8f8;line-height:10px;padding:0 2px}
#buildbar .bi .hk{position:absolute;top:2px;left:4px;font-size:9px;color:var(--dim)}
#buildbar .bi.sel{border-color:var(--gold);background:#2c3b70}
#buildbar .bi.no{opacity:.45}
#buildbar .bi.lock{opacity:.25}
#buildinfo{position:absolute;bottom:84px;left:50%;transform:translateX(-50%);background:rgba(14,20,40,.92);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;white-space:nowrap}
#keys{bottom:12px;right:12px;font-size:12px;color:#c8d2f0;background:rgba(14,20,40,.7);border-radius:10px;padding:6px 10px;line-height:1.9;text-align:right}
#toasts{left:12px;top:172px;display:flex;flex-direction:column;gap:6px;width:360px}
.toast{background:rgba(14,20,40,.92);border-left:4px solid #6a8ad8;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;animation:tin .25s ease-out;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.toast.gold{border-left-color:var(--gold)} .toast.red{border-left-color:#ff5050}
@keyframes tin{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
#bossbar{top:64px;left:50%;transform:translateX(-50%);width:min(560px,70vw);text-align:center}
#bossname{font-weight:800;color:#bfe8ff;text-shadow:0 0 10px #48a0ff;margin-bottom:4px;letter-spacing:.06em}
#bossbar .bar{height:18px;border-color:#4a80c0}
#bossfill{background:linear-gradient(90deg,#3a80ff,#80e0ff)}
#panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(860px,94vw);max-height:86vh;background:var(--panel);border:2px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.6);display:flex;flex-direction:column}
.phead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
#ptitle{font-size:20px;font-weight:800;color:var(--gold)}
#pclose{background:#2a3760;border:0;color:#fff;border-radius:8px;width:32px;height:32px;font-size:16px}
#ptabs{display:flex;gap:6px;padding:10px 16px 0}
#ptabs button{background:#1f2c4d;border:1px solid var(--line);color:#dfe8ff;border-radius:8px;padding:6px 12px;font-weight:700}
#ptabs button.on{background:#3a4c8a;border-color:var(--gold)}
#pbody{padding:14px 16px;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:flex-start}
.card .big{font-size:30px;width:40px;text-align:center}
.card .nm{font-weight:800}
.card .ds{font-size:12px;color:var(--dim);margin:2px 0 6px}
.cost{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.cost span{font-size:12px;font-weight:700;background:#0f1730;border-radius:6px;padding:2px 6px}
.cost .ok{color:var(--good)} .cost .no{color:var(--bad)}
.btn{background:linear-gradient(180deg,#f2c94c,#d8a830);color:#1a1408;border:0;border-radius:8px;padding:6px 14px;font-weight:800}
.btn:disabled{background:#3a4260;color:#8890a8;cursor:default}
.btn.alt{background:#2c3b70;color:#fff}
.stn{font-size:13px;margin-bottom:10px;color:var(--dim)} .stn b{color:var(--good)} .stn i{color:var(--bad);font-style:normal}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.slot{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;align-items:center;gap:8px;font-size:13px}
.slot .big{font-size:24px}
.slot.eq{border-color:var(--gold)}
h3{margin:12px 0 8px;color:#cfd8ff;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.ql{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ql.tr{border-color:var(--gold)}
.ql .t{font-weight:800}
.ql .k{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--dim)}
#dialog{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:min(720px,94vw);background:linear-gradient(180deg,#1f2c4d,#16203a);border:2px solid var(--gold);border-radius:16px;padding:14px 18px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#dname{font-weight:800;color:var(--gold);font-size:16px;margin-bottom:6px}
#dtext{font-size:15px;line-height:1.6}
#dbtns{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.qoffer{font-size:12px;letter-spacing:.06em;color:#bcd0ff;margin-bottom:6px}
.qreward{margin-top:8px;font-size:13px;color:var(--gold);font-weight:700}
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(10,16,40,.15),rgba(10,16,40,.75))}
#title h1{font-size:clamp(48px,9vw,104px);margin:0;letter-spacing:.06em;font-weight:900;background:linear-gradient(180deg,#fff6d0,#f2c94c 55%,#d08a20);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 #6a3a10) drop-shadow(0 12px 24px rgba(0,0,0,.5))}
#title .sub{font-size:clamp(16px,2.4vw,24px);font-weight:700;color:#e6eeff;letter-spacing:.3em;text-transform:uppercase;margin:6px 0 34px;text-shadow:0 2px 8px #000}
#title .menu{display:flex;flex-direction:column;gap:10px;width:260px}
#title .menu button{padding:14px;font-size:18px;font-weight:800;border-radius:12px;border:2px solid #f2c94c;background:rgba(20,28,60,.85);color:#fff}
#title .menu button:hover{background:#2c3b70}
#title .menu button.primary{background:linear-gradient(180deg,#f2c94c,#d8a830);color:#1a1408}
#title .foot{position:absolute;bottom:16px;font-size:13px;color:#c8d2f0;text-shadow:0 1px 3px #000}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,8,24,.7)}
#overlay .box{background:var(--panel);border:2px solid var(--gold);border-radius:18px;padding:26px 30px;text-align:center;max-width:560px;width:92vw}
#overlay h2{margin:0 0 10px;font-size:32px;color:var(--gold)}
#overlay p{color:#d8e0ff;line-height:1.6}
#overlay .btns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.help td{padding:4px 10px;font-size:14px}
.help td:first-child{text-align:right;white-space:nowrap}
body.building #res{bottom:150px} body.building #keys{display:none} body.building #action{bottom:150px}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s}
#fade.on{opacity:1}
#bigmap{display:block;margin:0 auto;border-radius:12px;background:#0a1028}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--dim);margin-top:8px;flex-wrap:wrap}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="hidden">
  <div id="stats"><div class="row"><span id="lvl">Lv 1</span><span id="coins">🪙 0</span></div>
    <div class="bar hp"><div id="hpfill"></div><span id="hptext"></span></div><div class="bar xp"><div id="xpfill"></div></div><div id="gear"></div></div>
  <div id="clock"></div>
  <div id="mapwrap"><div style="position:relative"><canvas id="minimap" width="200" height="200" title="Scroll to zoom · double-click to reset"></canvas><div id="minizoom" class="hidden" style="position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(14,20,40,.9);border-radius:8px;padding:2px 8px;font-size:11px;font-weight:700">Zoom</div></div><div id="islname"></div></div>
  <div id="tracker"></div>
  <div id="hint" class="hidden"></div>
  <div id="toasts"></div>
  <div id="res"></div>
  <div id="action" class="hidden"></div>
  <div id="buildinfo" class="hidden"></div>
  <div id="buildbar" class="hidden"></div>
  <div id="keys"><kbd>C</kbd> Craft <kbd>B</kbd> Build <kbd>I</kbd> Bag <kbd>J</kbd> Quests <kbd>M</kbd> Map <kbd>L</kbd> Journal <kbd>Esc</kbd> Menu</div>
  <div id="bossbar" class="hidden"><div id="bossname">THE TEMPEST WARLORD</div><div class="bar"><div id="bossfill"></div></div></div>
</div>
<div id="panel" class="hidden"><div class="phead"><span id="ptitle"></span><button id="pclose">✕</button></div><div id="ptabs"></div><div id="pbody"></div></div>
<div id="dialog" class="hidden"><div id="dname"></div><div id="dtext"></div><div id="dbtns"></div></div>
<div id="title">
  <h1>SKYWRIGHT</h1>
  <div class="sub">The Shattered Isles</div>
  <div class="menu">
    <button id="bContinue" class="primary hidden">Continue</button>
    <button id="bNew">New Game</button>
    <button id="bHelp">How to Play</button>
  </div>
  <div class="foot">Best played with keyboard and mouse · Progress saves automatically in this browser</div>
</div>
<div id="overlay" class="hidden"></div>
<div id="fade"></div>
<script>
'use strict';
// ===================== CORE CONSTANTS & DATA =====================
const HW = 32, HH = 16;           // half tile width/height (iso)
const W = 1300;                   // world size in tiles (sky disc in the top-left 860, the ground below)
const SKY_W = 860;
const CX = 430, CY = 430;         // world center (home island)
const ISLAND_TARGET = 1000, VILLAGE_TARGET = 50, FORT_TARGET = 20;
const SEED = 20261122;
const DAY_LEN = 300;              // seconds per full day
const SAVE_KEY = 'skywright_save_v3';

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash2(x,y){let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+(b-a)*Math.random();
const rndi=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d;}

// Tile types
const T = {VOID:0, GRASS:1, SAND:2, BLOOM:3, MOSS:4, CRYST:5, STORM:6, PATH:7, WATER:8, SVOID:9};

const BIOMES = {
  meadow: {ground:T.GRASS, name:'Meadow', deco:[['tree',.10],['bush',.05],['grass',.09],['rock',.035],['iron',.006],['flower',.015]]},
  bloom:  {ground:T.BLOOM, name:'Bloomwood', deco:[['bloomtree',.09],['flower',.07],['bush',.05],['grass',.035],['rock',.03],['iron',.02]]},
  fungal: {ground:T.MOSS, name:'Sporelands', deco:[['shroomtree',.09],['glowcap',.05],['grass',.03],['rock',.04],['iron',.03],['bush',.025]]},
  crystal:{ground:T.CRYST, name:'Glimmer Reach', deco:[['glasstree',.06],['crystal',.035],['rock',.05],['iron',.03],['grass',.03],['bush',.015]]},
  storm:  {ground:T.STORM, name:'Storm Isle', deco:[['deadtree',.04],['rock',.05],['crystal',.015]]},
};

// Items
const ITEMS = {
  wood:{n:'Wood',i:'🪵',sell:1}, stone:{n:'Stone',i:'🪨',sell:1}, fiber:{n:'Fiber',i:'🧵',sell:1},
  berries:{n:'Berries',i:'🫐',sell:1,heal:6}, seeds:{n:'Seeds',i:'🌱',sell:1}, iron:{n:'Iron Ore',i:'🔩',sell:4},
  crystal:{n:'Crystal',i:'💎',sell:8}, petal:{n:'Petals',i:'🌸',sell:2}, glowcap:{n:'Glowcap',i:'🍄',sell:3},
  wheat:{n:'Wheat',i:'🌾',sell:2}, arrows:{n:'Arrows',i:'🪶',sell:0}, shard:{n:'Sky Shard',i:'🔷',sell:0,quest:true},
  bandage:{n:'Bandage',i:'🩹',heal:20,sell:2}, roast:{n:'Roast Berries',i:'🍢',heal:18,sell:3},
  tonic:{n:'Petal Tonic',i:'🍹',heal:32,sell:6}, bread:{n:'Bread',i:'🍞',heal:40,sell:5}, potion:{n:'Health Potion',i:'🧪',heal:75,sell:12},
  crude_pick:{n:'Crude Pickaxe',i:'⛏️',gear:'pick',pow:2,tier:1}, stone_pick:{n:'Stone Pickaxe',i:'⛏️',gear:'pick',pow:3,tier:2}, iron_pick:{n:'Iron Pickaxe',i:'⛏️',gear:'pick',pow:5,tier:3},
  crude_axe:{n:'Crude Axe',i:'🪓',gear:'axe',pow:3}, stone_axe:{n:'Stone Axe',i:'🪓',gear:'axe',pow:5},
  club:{n:'Wooden Club',i:'🏏',gear:'weapon',dmg:9}, stone_sword:{n:'Stone Sword',i:'🗡️',gear:'weapon',dmg:15},
  iron_sword:{n:'Iron Sword',i:'⚔️',gear:'weapon',dmg:26}, crystal_blade:{n:'Crystal Blade',i:'💠',gear:'weapon',dmg:40},
  storm_hammer:{n:'Stormbreaker',i:'🔨',gear:'weapon',dmg:65},
  bow:{n:'Hunting Bow',i:'🏹',gear:'bow'},
  vest:{n:'Fiber Vest',i:'🦺',gear:'armor',armor:.15}, iron_armor:{n:'Iron Armor',i:'🛡️',gear:'armor',armor:.35}, crystal_armor:{n:'Crystal Armor',i:'🔰',gear:'armor',armor:.5},
};
const WEAPON_COL = {fists:'#e8c8a0', club:'#8a5a2a', stone_sword:'#a8a8b0', iron_sword:'#dfe6ee', crystal_blade:'#8ff0ff', storm_hammer:'#ffe060'};

const RECIPES = [
  {id:'crude_pick', st:'hand', cost:{wood:3,fiber:2}},
  {id:'crude_axe',  st:'hand', cost:{wood:3,fiber:2}},
  {id:'club',       st:'hand', cost:{wood:5}},
  {id:'bandage',    st:'hand', cost:{fiber:4}, qty:1},
  {id:'stone_pick', st:'workbench', cost:{wood:4,stone:6}},
  {id:'stone_axe',  st:'workbench', cost:{wood:4,stone:6}},
  {id:'stone_sword',st:'workbench', cost:{wood:3,stone:6}},
  {id:'bow',        st:'workbench', cost:{wood:8,fiber:6}},
  {id:'arrows',     st:'workbench', cost:{wood:2,stone:1}, qty:8},
  {id:'vest',       st:'workbench', cost:{fiber:16,wood:2}},
  {id:'roast',      st:'campfire', cost:{berries:3}, qty:1},
  {id:'bread',      st:'campfire', cost:{wheat:3}, qty:1},
  {id:'tonic',      st:'campfire', cost:{petal:3,berries:1}, qty:1},
  {id:'potion',     st:'campfire', cost:{berries:3,glowcap:2}, qty:1},
  {id:'iron_pick',  st:'forge', cost:{wood:4,iron:6}},
  {id:'iron_sword', st:'forge', cost:{wood:3,iron:9}},
  {id:'iron_armor', st:'forge', cost:{iron:14,fiber:6}},
  {id:'crystal_blade', st:'forge', cost:{iron:8,crystal:10}},
  {id:'crystal_armor', st:'forge', cost:{iron:8,crystal:14}},
];
const STATION_NAMES = {hand:'By Hand', workbench:'Workbench', campfire:'Campfire', forge:'Forge'};

// Structures. Player-buildable ones have cost.
const STRUCTS = {
  bridge:   {n:'Bridge',i:'🌉',cost:{wood:1},hp:60,walk:true,flat:true,onVoid:true,d:'Planks over open sky. Place next to land or another bridge.'},
  torch:    {n:'Torch',i:'🔥',cost:{wood:2,fiber:1},hp:20,light:4.2,d:'Light that burns Gloomlings at night.'},
  campfire: {n:'Campfire',i:'🏕️',cost:{wood:5,stone:3},hp:60,solid:true,light:5.5,station:'campfire',d:'Heals you nearby. Cooking station.'},
  workbench:{n:'Workbench',i:'🛠️',cost:{wood:12,stone:4},hp:100,solid:true,station:'workbench',d:'Crafting station for stone tools, bows, armor.'},
  wall_wood:{n:'Wood Wall',i:'🪵',cost:{wood:4},hp:120,solid:true,d:'Blocks enemies. They will try to break it.'},
  fence:    {n:'Fence',i:'🚧',cost:{wood:2},hp:50,solid:true,d:'Light barrier. Decorative.'},
  banner:   {n:'Banner',i:'🚩',cost:{wood:2,fiber:4},hp:30,solid:true,d:'Show off your colors.'},
  farm:     {n:'Farm Plot',i:'🟫',cost:{wood:3,fiber:3},hp:40,flat:true,walk:true,d:'Plant seeds with E. Harvest wheat.'},
  floor:    {n:'Stone Floor',i:'⬜',cost:{stone:1},hp:200,flat:true,walk:true,d:'Decorative paving.',req:'workbench'},
  wall_stone:{n:'Stone Wall',i:'🧱',cost:{stone:5},hp:320,solid:true,d:'Tough wall.',req:'workbench'},

const tiles = new Uint8Array(W*W);
const islandOf = new Int16Array(W*W);
const decoGrid = new Int32Array(W*W);
const structGrid = new Int32Array(W*W);
const explored = new Uint8Array(W*W);
let forts = [], decos = [], structs = [], islands = [], camps = [], npcs = [], pickups = [], villages = [], shaking = [];
let islandByKey = {};

const idx = (x,y)=>y*W+x;
const inB = (x,y)=>x>=0&&y>=0&&x<W&&y<W;
function tileAt(x,y){return inB(x,y)?tiles[idx(x,y)]:T.VOID;}
function isVoidT(t){return t===T.VOID||t===T.SVOID;}
function isLand(x,y){const t=tileAt(x,y);return !isVoidT(t)&&t!==T.WATER;}
function structAt(x,y){if(!inB(x,y))return null;const s=structGrid[idx(x,y)];return s>=0?structs[s]:null;}
function decoAt(x,y){if(!inB(x,y))return null;const d=decoGrid[idx(x,y)];return d>=0?decos[d]:null;}
function islandAt(x,y){ x=Math.floor(x); y=Math.floor(y); if(!inB(x,y)) return null; const i=islandOf[idx(x,y)]; return i>=0?islands[i]:null; }

function blocked(tx,ty,proj){
  if(!inB(tx,ty)) return true;
  const i=idx(tx,ty), t=tiles[i], si=structGrid[i];
  const st = si>=0 ? structs[si] : null;
  if(st && STRUCTS[st.type].solid) return true;
  if(isVoidT(t)){ if(proj) return false; return !(st && STRUCTS[st.type].walk); }
  if(t===T.WATER) return !proj;
  const di=decoGrid[i]; if(di>=0 && DECO[decos[di].type].solid) return true;
  return false;
}
function walkable(tx,ty){return !blocked(tx,ty,false);}

function addStruct(type,x,y,owner,data){
  const def=STRUCTS[type]; const w=def.w||1,h=def.h||1;
  const s={id:structs.length,type,x,y,w,h,owner:owner||'player',hp:def.hp||100,maxHp:def.hp||100,data:data||{},alive:true,t:Math.random()*10};
  structs.push(s);
  for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++){
    if(!inB(xx,yy))continue;
    const i=idx(xx,yy); structGrid[i]=s.id;
    const di=decoGrid[i]; if(di>=0){decos[di].alive=false;decoGrid[i]=-1;}
  }
  if(typeof invalidateMap==='function') invalidateMap(s);
  return s;
}
function removeStruct(s){
  s.alive=false;
  for(let yy=s.y;yy<s.y+s.h;yy++)for(let xx=s.x;xx<s.x+s.w;xx++){ if(inB(xx,yy)&&structGrid[idx(xx,yy)]===s.id) structGrid[idx(xx,yy)]=-1; }
  if(typeof invalidateMap==='function') invalidateMap(s);
}
function addDeco(type,x,y){
  const i=idx(x,y); if(decoGrid[i]>=0||structGrid[i]>=0) return null;
  const d={id:decos.length,type,x,y,hp:DECO[type].hp,alive:true,shake:0,v:hash2(x*7,y*13),berries:true};
  decos.push(d); decoGrid[i]=d.id; return d;
}
function removeDeco(d){ d.alive=false; if(decoGrid[idx(d.x,d.y)]===d.id) decoGrid[idx(d.x,d.y)]=-1; }

function footprintFree(x,y,w,h){
  for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++){
    if(!inB(xx,yy))return false; const t=tiles[idx(xx,yy)];
    if(isVoidT(t)||t===T.WATER)return false; if(structGrid[idx(xx,yy)]>=0)return false;
  }
  return true;
}
function nearestWalkable(x,y,maxR){
  x=Math.floor(x);y=Math.floor(y);
  for(let r=0;r<=(maxR||6);r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;
    if(walkable(x+dx,y+dy) && isLand(x+dx,y+dy)) return {x:x+dx+.5,y:y+dy+.5};
  }
  return {x:x+.5,y:y+.5};
}
function voidNeighbor(x,y){return isVoidT(tileAt(x+1,y))||isVoidT(tileAt(x-1,y))||isVoidT(tileAt(x,y+1))||isVoidT(tileAt(x,y-1))||isVoidT(tileAt(x+1,y+1))||isVoidT(tileAt(x-1,y-1))||isVoidT(tileAt(x+1,y-1))||isVoidT(tileAt(x-1,y+1));}

  const st=islandByKey.storm, stormR=st.r*1.16+8;
  // spatial hash for placement
  const HC=48, hash=new Map(); const hk=(x,y)=>Math.floor(x/HC)+','+Math.floor(y/HC);
  const hadd=o=>{ const k=hk(o.x,o.y); if(!hash.has(k)) hash.set(k,[]); hash.get(k).push(o); };
  for(const isl of islands) hadd(isl);
  const fits=(x,y,rad,gap)=>{
    if(x-rad*1.2<4||y-rad*1.2<4||x+rad*1.2>SKY_W-5||y+rad*1.2>SKY_W-5) return false;
    if(dist(x,y,CX,CY)>412) return false;
    if(dist(x,y,st.x,st.y)<stormR+rad*1.16+3) return false;
    const cx=Math.floor(x/HC), cy=Math.floor(y/HC);
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){ const a=hash.get((cx+dx)+','+(cy+dy)); if(!a) continue;
      for(const o of a){ const g=(o.story||o.kind==='village')?Math.max(gap,4):gap; if(dist(x,y,o.x,o.y)<(rad+o.r)*1.16+g) return false; } }
    return true;
  };
  const rndPt=()=>{ const a=r()*6.283, d=Math.sqrt(r())*410; return [Math.round(CX+Math.cos(a)*d),Math.round(CY+Math.sin(a)*d)]; };
  const vcenters=islands.filter(i=>i.village).map(i=>({x:i.x,y:i.y}));
  const newIsland=(o)=>{ o.id=islands.length; o.p=[r()*6.283,r()*6.283,r()*6.283]; o.name=o.name||makeName(); islands.push(o); hadd(o); islandByKey[o.key]=o; return o; };
  function makeName(suffix){ for(let t=0;t<60;t++){ const n=NAME_A[Math.floor(r()*NAME_A.length)]+NAME_B[Math.floor(r()*NAME_B.length)]; const full=suffix?n+' '+suffix:n; if(!used.has(full)){used.add(full);return full;} } return 'Nameless Isle '+used.size; }
  // ---- procedural villages (bigger islands)
  let vMin=78, nv=0;
  for(let tries=0;nv<VILLAGE_TARGET-4&&tries<60000;tries++){
    if(tries===30000) vMin=58;
    const [x,y]=rndPt(); if(dist(x,y,CX,CY)<120) continue;
    if(vcenters.some(v=>dist(v.x,v.y,x,y)<vMin)) continue;
    const rad=16+Math.floor(r()*5); if(!fits(x,y,rad,6)) continue;
    const tier=procTier(x,y); const vname=makeName();
    newIsland({key:'v'+nv,kind:'village',x,y,r:rad,tier,biome:procBiome(tier,x,y,r),village:{name:vname,roof:ROOFS[Math.floor(r()*ROOFS.length)]},name:vname+' Isle'});
    vcenters.push({x,y}); nv++;
  }
  // ---- boss fortresses (big islands with many watchposts and a keep)
  let nf=0; const fcenters=[];
  for(let tries=0;nf<FORT_TARGET&&tries<80000;tries++){
    const [x,y]=rndPt(); if(dist(x,y,CX,CY)<150) continue;
    if(vcenters.some(v=>dist(v.x,v.y,x,y)<62)) continue;
    if(fcenters.some(f=>dist(f.x,f.y,x,y)<(tries<40000?90:70))) continue;
    const rad=18+Math.floor(r()*4); if(!fits(x,y,rad,5)) continue;
    const tier=Math.max(2,procTier(x,y)); const fname=makeName(FORT_WORDS[Math.floor(r()*FORT_WORDS.length)]);
    newIsland({key:'f'+nf,kind:'fortress',x,y,r:rad,tier,biome:procBiome(tier,x,y,r),name:fname,
      fort:{name:fname,boss:FORT_BOSS[tier],bossName:FORT_BOSS_NAMES[nf%FORT_BOSS_NAMES.length],posts:3+Math.floor(r()*3),mult:1+Math.max(0,dist(x,y,CX,CY)-300)/220}});
    fcenters.push({x,y}); nf++;
  }
  // ---- procedural camps
  let nc=0;
  for(let tries=0;nc<260&&tries<80000;tries++){
    const [x,y]=rndPt(); if(dist(x,y,CX,CY)<110) continue;
    if(vcenters.some(v=>dist(v.x,v.y,x,y)<44)) continue;
    if(fcenters.some(f=>dist(f.x,f.y,x,y)<40)) continue;
    const rad=7+Math.floor(r()*4); if(!fits(x,y,rad,3+r()*4)) continue;
    const tier=procTier(x,y); const types=CAMP_TYPES[tier][Math.floor(r()*2)];
    const chief=r()<.22; const cname=makeName(CAMP_WORDS[Math.floor(r()*CAMP_WORDS.length)]);
    newIsland({key:'c'+nc,kind:'camp',x,y,r:rad,tier,biome:procBiome(tier,x,y,r),name:cname,
      camp:{name:cname,types,count:Math.min(7,2+tier+Math.floor(r()*2)),chief:chief?types[types.length>2?2:0]:null,chiefName:chief?CHIEF_NAMES[Math.floor(r()*CHIEF_NAMES.length)]:null,mult:1+Math.max(0,dist(x,y,CX,CY)-300)/220}});
    nc++;
  }
  // ---- resource / wild islands fill the rest
  let nr=0;
  for(let tries=0;islands.length<ISLAND_TARGET&&tries<600000;tries++){
    const [x,y]=rndPt(); const rad=3+Math.floor(Math.pow(r(),1.6)*8);
    if(!fits(x,y,rad,3+r()*5)) continue;
    const near=dist(x,y,CX,CY)<100; const tier=near?1:procTier(x,y);
    const biome=near?'meadow':procBiome(tier,x,y,r);
    const rich={}; const roll=r(); if(roll<.18) rich.tree=2.2; else if(roll<.32){rich.rock=2.5;rich.iron=3;} else if(roll<.44) rich.flower=3; else if(roll<.52&&tier>=3) rich.crystal=3; else if(roll<.62) rich.bush=2.5;
    newIsland({key:'r'+nr,kind:'res',x,y,r:rad,tier,biome,rich,treasure:rad>=4&&r()<.07});
    nr++;
  }
  // ---- carve island shapes
  for(const isl of islands){
    const R=a=>isl.r*(1+.08*Math.sin(3*a+isl.p[0])+.05*Math.sin(5*a+isl.p[1])+.025*Math.sin(9*a+isl.p[2]));
    isl.R=R; const b=Math.ceil(isl.r*1.2)+1; const gt=BIOMES[isl.biome].ground;
    for(let y=isl.y-b;y<=isl.y+b;y++)for(let x=isl.x-b;x<=isl.x+b;x++){
      if(!inB(x,y))continue;
      const dx=x+.5-isl.x, dy=y+.5-isl.y, d=Math.hypot(dx,dy);
      if(d<R(Math.atan2(dy,dx))){ tiles[idx(x,y)]=gt; islandOf[idx(x,y)]=isl.id; }
    }
  }
  // storm barrier
  for(let y=Math.floor(st.y-stormR-1);y<=st.y+stormR+1;y++)for(let x=Math.floor(st.x-stormR-1);x<=st.x+stormR+1;x++){ if(!inB(x,y))continue; const i=idx(x,y); if(tiles[i]===T.VOID && dist(x+.5,y+.5,st.x,st.y)<stormR) tiles[i]=T.SVOID; }
  // rims & ponds
  for(const isl of islands){
    const b=Math.ceil(isl.r*1.2)+1;
    if(isl.biome==='meadow'){
      for(let y=isl.y-b;y<=isl.y+b;y++)for(let x=isl.x-b;x<=isl.x+b;x++){
        if(!inB(x,y)||islandOf[idx(x,y)]!==isl.id)continue;
        if(voidNeighbor(x,y) && hash2(x,y)<.45) tiles[idx(x,y)]=T.SAND;
      }
    }
    const pond = isl.village ? true : (!isl.camp && !isl.boss && isl.r>=6 && (isl.story || r()<.35));
    if(pond){
      const a=r()*6.283, dd=isl.village? isl.r*.72 : isl.r*.35, pr=isl.village?1.6:1.2+r()*.9;
      const px=isl.x+Math.cos(a)*dd, py=isl.y+Math.sin(a)*dd;
      for(let y=Math.floor(py-3);y<=py+3;y++)for(let x=Math.floor(px-3);x<=px+3;x++){
        if(!inB(x,y)||islandOf[idx(x,y)]!==isl.id)continue;
        if(dist(x+.5,y+.5,px,py)<pr && !voidNeighbor(x,y)) tiles[idx(x,y)]=T.WATER;
      }
    }
  }
  // villages, camps
  for(const isl of islands){
    if(isl.village) makeVillage(isl,r);
    if(isl.camp) makeCamp(isl,r);
    if(isl.fort) makeFortress(isl,r);
  }
  // plinth on Petalmoor toward storm
  const pm=islandByKey.petal; const ang=Math.atan2(st.y-pm.y,st.x-pm.x);
  let px=Math.floor(pm.x+Math.cos(ang)*(pm.r-3.5)), py=Math.floor(pm.y+Math.sin(ang)*(pm.r-3.5));
  for(let y=py-1;y<=py+1;y++)for(let x=px-1;x<=px+1;x++) if(isLand(x,y)) tiles[idx(x,y)]=T.PATH;
  if(structAt(px,py)) removeStruct(structAt(px,py));
  addStruct('plinth',px,py,'world'); plinthPos={x:px+.5,y:py+.5};
  for(let k=0;k<8;k++){ const a=k/8*6.283; const x=Math.floor(st.x+Math.cos(a)*7), y=Math.floor(st.y+Math.sin(a)*7); if(footprintFree(x,y,1,1)) addStruct('pillar',x,y,'world'); }
  // treasure chests on small wild isles
  let tc=0;
  for(const isl of islands){ if(!isl.treasure) continue; const p={x:Math.floor(isl.x),y:Math.floor(isl.y)}; if(!footprintFree(p.x,p.y,1,1)) continue;
    const t=isl.tier, loot={coins:20+t*30}; const res=[['wood','stone'],['wood','iron'],['iron','petal'],['glowcap','iron'],['crystal','iron'],['crystal','iron']][t];
    loot[res[0]]=4+t*2; loot[res[1]]=3+t*2; if(t>=2) loot.potion=1;
    addStruct('chest',p.x,p.y,'world',{special:'tc'+(tc++),loot}); }
  // decorations / resources (sky disc only; the ground generates its own)
  for(let y=0;y<SKY_W;y++)for(let x=0;x<SKY_W;x++){
    const i=idx(x,y); const t=tiles[i]; if(isVoidT(t)||t===T.WATER||t===T.PATH) continue;
    if(structGrid[i]>=0) continue;
    const isl=islands[islandOf[i]]; if(!isl) continue;
    const dC=dist(x+.5,y+.5,isl.x,isl.y);
    if(isl.village && dC<isl.r*.78) { if(r()<.03) addDeco('flower',x,y); continue; }
    if(isl.camp && dC<4.6) continue;
    if(isl.boss && dC<6) continue;
    const edge=voidNeighbor(x,y);
    let roll=r(); const table=BIOMES[isl.biome].deco;
    for(const [type,w0] of table){
      let w=w0*(isl.rich&&isl.rich[type]?isl.rich[type]:1);
      if(type==='iron'&&isl.tier<1) w=0;
      if(type==='crystal'&&isl.biome!=='crystal'&&isl.biome!=='storm') w=0;
      if(roll<w){ if(edge&&DECO[type].solid) break; addDeco(type,x,y); break; }
      roll-=w;
    }
  }
  // guarantee starter resources on home island
  const home=islandByKey.home;
  const need={rock:7,tree:7,bush:6,grass:7};
  for(const k in need){ let n=need[k], tries=0;
    while(n>0&&tries<600){ tries++; const a=r()*6.283, d=home.r*.62+r()*home.r*.3; const x=Math.floor(home.x+Math.cos(a)*d), y=Math.floor(home.y+Math.sin(a)*d);
      if(!inB(x,y)||islandOf[idx(x,y)]!==home.id||!isLand(x,y)||tiles[idx(x,y)]===T.PATH) continue;
      if(DECO[k].solid&&voidNeighbor(x,y)) continue;
      if(addDeco(k,x,y)) n--; }
  }
  // NPCs (story)
  const mkNPC=(o,isl)=>{ const p=nearestWalkable(isl.x+o.off[0],isl.y+o.off[1],5); npcs.push(Object.assign({x:p.x,y:p.y,hx:p.x,hy:p.y,tx:p.x,ty:p.y,wt:Math.random()*3,face:1,bob:0,isl:isl.key},o)); };
  for(const nd of NPC_DEFS){ const isl=islandByKey[nd.isl]; mkNPC({id:nd.id,name:nd.name,off:nd.off,col:nd.col,look:nd.look,shop:!!nd.shop},isl); }
  // NPCs (procedural villages)
  const looks=['straw','helm','band','cap','kid','elder'];
  for(const isl of islands){ if(isl.story||!isl.village) continue; const vn=isl.village.name, k=isl.key;
    const pn=()=>VILLAGER_NAMES[Math.floor(r()*VILLAGER_NAMES.length)];
    const col=()=>ROOFS[Math.floor(r()*ROOFS.length)];
    mkNPC({id:'elder_'+k,name:'Elder '+pn(),off:[0,-2],col:col(),look:'elder',lines:GENERIC_LINES},isl);
    mkNPC({id:'shop_'+k,name:'Merchant '+pn(),off:[-2,-4],col:col(),look:'cap',shop:true,lines:GENERIC_LINES},isl);
    for(let j=0;j<2;j++){ const a=r()*6.283; mkNPC({id:'vil_'+k+'_'+j,name:pn(),off:[Math.round(Math.cos(a)*3),Math.round(Math.sin(a)*3)],col:col(),look:looks[Math.floor(r()*looks.length)],lines:GENERIC_LINES},isl); }
  }
  // pickups
  const wm=islandByKey.windmere; const kp=nearestWalkable(wm.x-3,wm.y+2,4);
  pickups.push({id:'kite',name:"Pip's Kite",icon:'🪁',x:kp.x,y:kp.y,taken:false});
  const lp=islandByKey.lone; const cx=Math.floor(lp.x),cy=Math.floor(lp.y);
  for(let y=cy-1;y<=cy+1;y++)for(let x=cx-1;x<=cx+1;x++){const d=decoAt(x,y); if(d) removeDeco(d);}
  if(!structAt(cx,cy)) addStruct('chest',cx,cy,'world',{special:'lonechest',loot:{coins:200,crystal:5,potion:2}});
  homeSpawn=nearestWalkable(home.x,home.y+2.5,4);
  if(typeof genExtras==='function') genExtras(r);
  if(typeof genProcQuests==='function') genProcQuests(r);
  if(typeof genGround==='function') genGround();
  if(typeof genShrines==='function') genShrines();
  if(typeof genDiamonds==='function') genDiamonds();
}

function makeVillage(isl,r){
  const cx=isl.x, cy=isl.y; const R=isl.r;
  const v={key:isl.key,name:isl.village.name,x:cx+.5,y:cy+.5,roof:isl.village.roof,isl:isl.id,r:R};
  villages.push(v); isl.vill=v;
  const reach=R*.82;
  for(let y=Math.floor(cy-reach);y<=cy+reach;y++)for(let x=Math.floor(cx-reach);x<=cx+reach;x++){
    if(!inB(x,y)||islandOf[idx(x,y)]!==isl.id||tiles[idx(x,y)]===T.WATER) continue;
    const dx=x-cx, dy=y-cy, d=Math.hypot(dx,dy);
    if(d<3.4 || ((Math.abs(dx)<.9||Math.abs(dy)<.9)&&d<reach) || (Math.abs(d-8.8)<.7)) tiles[idx(x,y)]=T.PATH;
  }
  addStruct('well',cx,cy,'world');
  const rings=[[5.8,6],[11.6,10]]; if(R>=18) rings.push([15.2,12]);
  for(const [rad,n] of rings){ const off=r()*6.283;
    for(let k=0;k<n;k++){ const a=off+k/n*6.283;
      const hx=Math.round(cx+Math.cos(a)*rad)-1, hy=Math.round(cy+Math.sin(a)*rad)-1;
      if(Math.abs(hx+1-cx)<2.2||Math.abs(hy+1-cy)<2.2) continue;
      if(footprintFree(hx,hy,2,2)&&footprintFree(hx-1,hy-1,1,1)) addStruct('house',hx,hy,'world',{roof:v.roof,door:k%2}); } }
  if(footprintFree(cx-3,cy-5,1,1)) addStruct('stall',cx-3,cy-5,'world',{col:v.roof});
  for(const [dx,dy] of [[3,3],[-3,3],[3,-3],[-3,-3],[7,0],[-7,0],[0,7],[0,-7]]) if(footprintFree(cx+dx,cy+dy,1,1)) addStruct('vlamp',cx+dx,cy+dy,'world');
  // fields
  for(let k=0;k<3;k++){ const a=r()*6.283, d=R*.62; const fx=Math.round(cx+Math.cos(a)*d), fy=Math.round(cy+Math.sin(a)*d);
    for(let yy=fy;yy<fy+2;yy++)for(let xx=fx;xx<fx+3;xx++) if(footprintFree(xx,yy,1,1)&&!voidNeighbor(xx,yy)) addStruct('vfarm',xx,yy,'world',{crop:'wheat',t:30+Math.floor(hash2(xx,yy)*61)}); }
  const story=isl.story;
  if(!story||isl.key==='petal'||isl.key==='spore'||isl.key==='glimmer'){
    if(footprintFree(cx-4,cy+2,1,1)) addStruct('vworkbench',cx-4,cy+2,'world');
    if(footprintFree(cx+2,cy+4,1,1)) addStruct('vcampfire',cx+2,cy+4,'world');
  }
}

function makeCamp(isl,r){
  const cx=isl.x, cy=isl.y, c=isl.camp;
  const camp={key:isl.key,name:c.name,x:cx+.5,y:cy+.5,isl:isl.id,tier:isl.tier,types:c.types,count:c.count,chief:c.chief||null,chiefName:c.chiefName||null,
    shard:!!c.shard,cleared:false,chiefDead:false,respawnT:0,totem:null,mult:c.mult||1,spawned:false,story:!!isl.story};
  for(let y=cy-4;y<=cy+4;y++)for(let x=cx-4;x<=cx+4;x++){ if(inB(x,y)&&islandOf[idx(x,y)]===isl.id&&dist(x,y,cx,cy)<3.6&&tiles[idx(x,y)]!==T.WATER&&!voidNeighbor(x,y)) tiles[idx(x,y)]=T.PATH; }
  camp.totem=addStruct('totem',cx,cy,'camp',{camp:isl.key});
  camp.totem.hp=camp.totem.maxHp=Math.round((90+isl.tier*70)*camp.mult);
  const n=3+Math.floor(r()*2);
  for(let k=0;k<n;k++){ const a=k/n*6.283+r(); const x=Math.round(cx+Math.cos(a)*3.2), y=Math.round(cy+Math.sin(a)*3.2); if(footprintFree(x,y,1,1)&&!voidNeighbor(x,y)) addStruct('tent',x,y,'world',{tier:isl.tier}); }
  if(footprintFree(cx+1,cy+2,1,1)) addStruct('ccamp',cx+1,cy+2,'world');
  camps.push(camp); isl.campObj=camp;
}

function makeFortress(isl,r){
  const f=isl.fort, cx=isl.x, cy=isl.y, t=isl.tier;
  const fort={key:isl.key,name:f.name,x:cx+.5,y:cy+.5,isl:isl.id,tier:t,posts:[],keep:null,bossName:f.bossName,cleared:false};
  isl.fortObj=fort; forts.push(fort);
  const mine=(x,y)=>inB(x,y)&&islandOf[idx(x,y)]===isl.id&&tiles[idx(x,y)]!==T.WATER&&!voidNeighbor(x,y);
  const pave=(px,py,rad)=>{ for(let y=Math.floor(py-rad);y<=py+rad;y++)for(let x=Math.floor(px-rad);x<=px+rad;x++) if(mine(x,y)&&dist(x,y,px,py)<rad) tiles[idx(x,y)]=T.PATH; };
  const road=(ax,ay,bx,by)=>{ const L=dist(ax,ay,bx,by); for(let s=0;s<=L;s+=.5){ const x=Math.round(lerp(ax,bx,s/L)), y=Math.round(lerp(ay,by,s/L)); for(const [dx,dy] of [[0,0],[1,0],[0,1]]) if(mine(x+dx,y+dy)) tiles[idx(x+dx,y+dy)]=T.PATH; } };
  pave(cx,cy,6.4);
  const n=f.posts, off=r()*6.283, angles=[];
  for(let k=0;k<n;k++){
    const a=off+k/n*6.283; let pr=isl.r*.64, px, py;
    for(;pr>5;pr-=1){ px=Math.round(cx+Math.cos(a)*pr); py=Math.round(cy+Math.sin(a)*pr); if(mine(px,py)&&mine(px+1,py+1)&&mine(px-1,py-1)) break; }
    if(pr<=5) continue;
    angles.push(a); road(cx,cy,px,py); pave(px,py,3);
    const s0=structAt(px,py); if(s0) removeStruct(s0);
    const key=isl.key+'_p'+k, types=CAMP_TYPES[t][k%2];
    const camp={key,name:`${f.name} Watchpost`,x:px+.5,y:py+.5,isl:isl.id,tier:t,types,count:4+Math.floor(r()*2)+(t>=4?1:0),chief:null,chiefName:null,
      shard:false,cleared:false,chiefDead:false,respawnT:0,mult:f.mult,spawned:false,fort:isl.key,post:true};
    camp.totem=addStruct('totem',px,py,'camp',{camp:key,post:true,tier:t}); camp.totem.hp=camp.totem.maxHp=Math.round((160+t*90)*f.mult);
    for(let j=0;j<2;j++){ const b=r()*6.283; const tx=Math.round(px+Math.cos(b)*2.2), ty=Math.round(py+Math.sin(b)*2.2); if(footprintFree(tx,ty,1,1)&&mine(tx,ty)) addStruct('tent',tx,ty,'world',{tier:t}); }
    if(footprintFree(px+1,py+1,1,1)) addStruct('ccamp',px+1,py+1,'world');
    camps.push(camp); fort.posts.push(key);
  }
  // palisade ring with gates facing each watchpost road
  for(let k=0;k<44;k++){ const a=k/44*6.283; if(angles.some(g=>Math.abs(angDiff(a,g))<.3)) continue;
    const x=Math.round(cx+Math.cos(a)*5.2), y=Math.round(cy+Math.sin(a)*5.2); if(footprintFree(x,y,1,1)&&mine(x,y)) addStruct('palisade',x,y,'world'); }
  const kkey=isl.key+'_keep';
  const keep={key:kkey,name:`${f.name} Keep`,x:cx+.5,y:cy+.5,isl:isl.id,tier:t,types:FORT_ELITES[t],count:5+t,chief:f.boss,chiefName:f.bossName,
    shard:false,cleared:false,chiefDead:false,respawnT:0,mult:f.mult,spawned:false,fort:isl.key,keep:true};
  const s0=structAt(cx,cy); if(s0) removeStruct(s0);
  keep.totem=addStruct('totem',cx,cy,'camp',{camp:kkey,keep:true,tier:t}); keep.totem.hp=keep.totem.maxHp=Math.round((450+t*220)*f.mult);
  for(let j=0;j<4;j++){ const b=off+.8+j*1.57; const tx=Math.round(cx+Math.cos(b)*3), ty=Math.round(cy+Math.sin(b)*3); if(footprintFree(tx,ty,1,1)) addStruct('tent',tx,ty,'world',{tier:t}); }
  if(footprintFree(cx+2,cy,1,1)) addStruct('ccamp',cx+2,cy,'world'); if(footprintFree(cx-2,cy,1,1)) addStruct('ccamp',cx-2,cy,'world');
  camps.push(keep); fort.keep=kkey;
}
function fortPostsLeft(fk){ return camps.filter(c=>c.fort===fk&&c.post&&!c.cleared).length; }

function buildSkybridge(){
  const st=islandByKey.storm; const a={x:plinthPos.x,y:plinthPos.y};
  const len=dist(a.x,a.y,st.x,st.y), ux=(st.x-a.x)/len, uy=(st.y-a.y)/len;
  for(let s=0;s<len;s+=.35){
    const x=a.x+ux*s, y=a.y+uy*s;
    for(const [ox,oy] of [[0,0],[.6,0],[0,.6],[-.6,0],[0,-.6]]){
      const tx=Math.floor(x+ox), ty=Math.floor(y+oy); if(!inB(tx,ty))continue;
      const i=idx(tx,ty); if(isVoidT(tiles[i]) && structGrid[i]<0) addStruct('skybridge',tx,ty,'world');
    }
  }
}

const isoX=(x,y)=>(x-y)*HW, isoY=(x,y)=>(x+y)*HH;
function S(x,y){return [ (x-y)*HW - cam.x + VW/2, (x+y)*HH - cam.y + VH/2 ];}
function screenToWorld(sx,sy){

const TILE_COL = {
  [T.GRASS]:['#7cc35a','#74bb53','#83c962','#6fb34e'], [T.SAND]:['#e6d39a','#ddc98f','#eadba6','#d8c384'],
  [T.BLOOM]:['#e7a9cb','#dd9dc1','#eeb5d4','#d894bb'], [T.MOSS]:['#76629a','#6c588f','#7f6ba3','#655287'],
  [T.CRYST]:['#a9dbe9','#9dd2e3','#b6e3ef','#93c8da'], [T.STORM]:['#5c6274','#555b6c','#646a7c','#4f5566'],
  [T.PATH]:['#c9a874','#c19f6b','#d1b17e','#bb9864'], [T.WATER]:['#4aa0d8','#459bd2','#50a6dd','#4296ce'],
};
const LIP_COL = {[T.GRASS]:'#4f9a3a',[T.SAND]:'#c8b070',[T.BLOOM]:'#c0789e',[T.MOSS]:'#4f3f70',[T.CRYST]:'#6fb0c8',[T.STORM]:'#3c4050',[T.PATH]:'#9a7a4c',[T.WATER]:'#3a80b0'};

function poly(g,pts,fill,stroke,lw){
  g.beginPath(); g.moveTo(pts[0],pts[1]); for(let i=2;i<pts.length;i+=2) g.lineTo(pts[i],pts[i+1]); g.closePath();
  if(fill){g.fillStyle=fill;g.fill();} if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||1;g.stroke();}
}
function ell(g,x,y,rx,ry,fill){g.beginPath();g.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);g.fillStyle=fill;g.fill();}
function circ(g,x,y,r,fill){g.beginPath();g.arc(x,y,Math.max(.1,r),0,Math.PI*2);g.fillStyle=fill;g.fill();}

function drawTileInto(g,x,y,ox,oy){
  const t=tiles[idx(x,y)]; if(isVoidT(t)) return;
  const tx=(x-y)*HW-ox, ty=(x+y)*HH-oy;
  const top=[tx,ty], rt=[tx+HW,ty+HH], bt=[tx,ty+HH*2], lf=[tx-HW,ty+HH];
  const h=hash2(x,y);
  // cliffs: sky islands are translucent blue or green crystal; the ground below stays earthen
  const rv=isVoidT(tileAt(x+1,y)), lv=isVoidT(tileAt(x,y+1));
  if(rv||lv){
    const sky=!(typeof GROUND_Y!=='undefined'&&y>GROUND_Y);
    const dR=(sky?44:34)+hash2(x+1,y)*(sky?40:30), dL=(sky?44:34)+hash2(x,y+1)*(sky?40:30), dB=Math.max(rv?dR:0,lv?dL:0);
    const isl=islandOf[idx(x,y)]; const green=hash2(isl*13+7,isl*29+3)<.5;
    const C=green?{l:['rgba(150,245,205,.82)','rgba(70,200,160,.55)','rgba(40,150,130,0)'],r:['rgba(95,210,170,.82)','rgba(45,165,135,.5)','rgba(30,120,110,0)'],ln:'rgba(225,255,240,.55)',gl:'#e8fff4'}
                  :{l:['rgba(160,220,255,.82)','rgba(80,160,240,.55)','rgba(50,110,220,0)'],r:['rgba(100,175,245,.82)','rgba(55,125,225,.5)','rgba(35,85,200,0)'],ln:'rgba(225,245,255,.55)',gl:'#f0f8ff'};
    if(lv){
      const gr=g.createLinearGradient(0,lf[1],0,lf[1]+dL);
      if(sky){ gr.addColorStop(0,C.l[0]); gr.addColorStop(.45,C.l[1]); gr.addColorStop(1,C.l[2]); } else { gr.addColorStop(0,'#a8744a'); gr.addColorStop(.5,'#7d5232'); gr.addColorStop(1,'#4d3020'); }
      poly(g,[lf[0],lf[1],bt[0],bt[1],bt[0],bt[1]+dB,lf[0]+8,lf[1]+dL*.7,lf[0],lf[1]+dL*.35],gr);
      g.strokeStyle=sky?C.ln:'rgba(60,35,20,.5)'; g.lineWidth=1; g.beginPath(); g.moveTo(lf[0],lf[1]+9); g.lineTo(bt[0],bt[1]+9); g.stroke();
      if(sky){ if(h<.45){ g.strokeStyle=C.ln; g.lineWidth=1.2; const rx=lerp(lf[0],bt[0],h*2); const ry=lerp(lf[1],bt[1],h*2)+6; g.beginPath(); g.moveTo(rx,ry); g.lineTo(rx+2,ry+14+h*18); g.stroke(); circ(g,rx+1,ry+4,1.4,C.gl); } }
      else if(h<.4){g.strokeStyle='#4a7a2a';g.lineWidth=1.5;g.beginPath();const rx=lerp(lf[0],bt[0],h*2);const ry=lerp(lf[1],bt[1],h*2)+3;g.moveTo(rx,ry);g.quadraticCurveTo(rx+4,ry+10,rx-2,ry+18+h*20);g.stroke();}
    }
    if(rv){
      const gr=g.createLinearGradient(0,rt[1],0,rt[1]+dR);
      if(sky){ gr.addColorStop(0,C.r[0]); gr.addColorStop(.45,C.r[1]); gr.addColorStop(1,C.r[2]); } else { gr.addColorStop(0,'#8a5c38'); gr.addColorStop(.5,'#654026'); gr.addColorStop(1,'#3d2618'); }
      poly(g,[bt[0],bt[1],rt[0],rt[1],rt[0],rt[1]+dR*.35,rt[0]-8,rt[1]+dR*.7,bt[0],bt[1]+dB],gr);
      g.strokeStyle=sky?C.ln:'rgba(40,25,15,.5)'; g.lineWidth=1; g.beginPath(); g.moveTo(bt[0],bt[1]+9); g.lineTo(rt[0],rt[1]+9); g.stroke();
      if(sky){ if(h>.55){ g.strokeStyle=C.ln; g.lineWidth=1.2; const rx=lerp(bt[0],rt[0],h-.5); const ry=lerp(bt[1],rt[1],h-.5)+6; g.beginPath(); g.moveTo(rx,ry); g.lineTo(rx-2,ry+12+h*16); g.stroke(); circ(g,rx-1,ry+3,1.3,C.gl); } }
      else if(h>.6){g.strokeStyle='#4a7a2a';g.lineWidth=1.5;g.beginPath();const rx=lerp(bt[0],rt[0],h-.5);const ry=lerp(bt[1],rt[1],h-.5)+3;g.moveTo(rx,ry);g.quadraticCurveTo(rx-4,ry+12,rx+2,ry+16+h*16);g.stroke();}
    }
    // lip
    g.lineWidth=4; g.strokeStyle=LIP_COL[t]; g.beginPath();
    if(lv){g.moveTo(lf[0],lf[1]+2);g.lineTo(bt[0],bt[1]+2);} if(rv){g.moveTo(bt[0],bt[1]+2);g.lineTo(rt[0],rt[1]+2);} g.stroke();
  }
  const pal=TILE_COL[t]; const col=pal[Math.floor(h*4)];
  poly(g,[top[0],top[1],rt[0],rt[1],bt[0],bt[1],lf[0],lf[1]],col);
  g.strokeStyle='rgba(0,0,0,.05)'; g.lineWidth=1; g.stroke();
  // texture
  if(t===T.WATER){
    g.strokeStyle='rgba(255,255,255,.35)'; g.lineWidth=1.5; g.beginPath(); g.moveTo(tx-10+h*8,ty+14); g.lineTo(tx+2+h*8,ty+14); g.stroke();
  } else if(t===T.PATH){
    for(let k=0;k<3;k++){const a=hash2(x*3+k,y*5),b=hash2(x*5+k,y*3);ell(g,tx+(a-.5)*36,ty+HH+(b-.5)*16,2.2,1.2,'rgba(90,60,30,.35)');}
  } else {
    const n=Math.floor(h*5);
    for(let k=0;k<n;k++){const a=hash2(x*11+k,y*7),b=hash2(x*7,y*11+k); const px=tx+(a-.5)*40*(1-Math.abs(b-.5)*1.6), py=ty+HH+(b-.5)*20;
      g.strokeStyle= t===T.GRASS?'#5da344': t===T.BLOOM?'#c27aa2': t===T.MOSS?'#5a4880': t===T.CRYST?'#e8fbff': t===T.STORM?'#444a5a': t===T.ASH?'#4a9038': t===T.GLOOMG?'#3a7a2e':'#c8b070';
      g.lineWidth=1.3; g.beginPath(); g.moveTo(px,py); g.lineTo(px-1.5,py-4); g.moveTo(px,py); g.lineTo(px+1.5,py-3.5); g.stroke();}
  }
}

function getChunk(cx,cy){
  const k=cx*1000+cy; let c=chunkCache.get(k);
  if(c){c.used=performance.now();return c;}
  const x0=cx*CH, y0=cy*CH;
  let any=false; for(let y=y0;y<y0+CH&&!any;y++)for(let x=x0;x<x0+CH;x++){ if(inB(x,y)&&!isVoidT(tiles[idx(x,y)])){any=true;break;} }
  if(!any){c={empty:true,used:performance.now()};chunkCache.set(k,c);return c;}
  const ox=(x0-(y0+CH))*HW-4, oy=(x0+y0)*HH-4;
  const cv=document.createElement('canvas'); cv.width=CH*2*HW+8; cv.height=CH*2*HH+80;
  const g=cv.getContext('2d');
  for(let s=0;s<CH*2-1;s++)for(let xx=0;xx<CH;xx++){const yy=s-xx; if(yy<0||yy>=CH)continue; const x=x0+xx,y=y0+yy; if(inB(x,y)) drawTileInto(g,x,y,ox,oy);}
  c={cv,ox,oy,used:performance.now()}; chunkCache.set(k,c);
  if(chunkCache.size>70){ let old=null,ok=null; for(const [kk,v] of chunkCache){ if(!v.empty&&(!old||v.used<old.used)){old=v;ok=kk;} } if(ok!==null) chunkCache.delete(ok); }
  return c;
}

// --------- clouds / sky
const clouds=[]; for(let i=0;i<26;i++) clouds.push({x:Math.random()*4000,y:Math.random()*2400,s:.6+Math.random()*1.4,sp:4+Math.random()*10,layer:Math.random()<.6?0:1});
function skyColors(){
  const d=darkness();
  const gr=typeof inGround==='function'&&inGround(P.y)&&!G.ext.groundClean;
  const top=mixCol(gr?[58,44,84]:[125,190,240],[12,16,48],d), bot=mixCol(gr?[96,80,120]:[200,230,252],[34,30,80],d);
  return [top,bot];
}
function mixCol(a,b,t){return `rgb(${Math.round(lerp(a[0],b[0],t))},${Math.round(lerp(a[1],b[1],t))},${Math.round(lerp(a[2],b[2],t))})`;}
function drawSky(){
  const [a,b]=skyColors(); const gr=ctx.createLinearGradient(0,0,0,VH); gr.addColorStop(0,a); gr.addColorStop(1,b);
  ctx.fillStyle=gr; ctx.fillRect(0,0,VW,VH);
  const d=darkness();
  if(d>.3){ ctx.fillStyle=`rgba(255,255,255,${(d-.3)*.9})`; for(let i=0;i<70;i++){ const x=(hash2(i,1)*VW*1.3 - cam.x*.05)%VW, y=(hash2(1,i)*VH - cam.y*.05)%VH; ctx.fillRect((x+VW)%VW,(y+VH)%VH,1.5,1.5);} }
  for(const c of clouds){ if(c.layer!==0) continue; drawCloud(c,.18,.45-d*.25); }
}
function drawCloud(c,par,alpha){
  const x=((c.x - cam.x*par + G.t*c.sp)%4000+4000)%4000-600, y=((c.y - cam.y*par)%2400+2400)%2400-400;
  if(x<-300||x>VW+300||y<-200||y>VH+200) return;
  ctx.globalAlpha=Math.max(0,alpha);
  const s=c.s*40;
  ell(ctx,x,y,s*1.6,s*.55,'#fff'); ell(ctx,x-s*.9,y+s*.1,s,s*.45,'#fff'); ell(ctx,x+s*.9,y+s*.12,s*1.1,s*.45,'#fff'); ell(ctx,x+s*.2,y-s*.3,s*.9,s*.5,'#fff');
  ctx.globalAlpha=1;
}

// --------- day / night
function darkness(){
  const t=G.time;
  if(t<.6) return 0; if(t<.7) return (t-.6)/.1*.74; if(t<.94) return .74; return (1-(t-.94)/.06)*.74;
}
function isNight(){return G.time>=.68&&G.time<.96;}
function timeLabel(){const t=G.time; if(t<.1)return'Dawn'; if(t<.3)return'Morning'; if(t<.5)return'Midday'; if(t<.6)return'Afternoon'; if(t<.7)return'Dusk'; if(t<.94)return'Night'; return'Dawn';}

// --------- main render
function viewBounds(){
  const pts=[screenToWorld(0,0),screenToWorld(VW,0),screenToWorld(0,VH),screenToWorld(VW,VH)];
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9; for(const p of pts){x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y);}
  return {x0:Math.floor(x0)-3,x1:Math.ceil(x1)+3,y0:Math.floor(y0)-3,y1:Math.ceil(y1)+5};
}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const sx=(Math.random()-.5)*shake*10, sy=(Math.random()-.5)*shake*10;
  drawSky();
  ctx.save(); ctx.translate(sx,sy);
  const vb=viewBounds();
  // ground chunks
  const cx0=Math.max(0,Math.floor(vb.x0/CH)), cx1=Math.min(Math.floor((W-1)/CH),Math.floor(vb.x1/CH));
  const cy0=Math.max(0,Math.floor(vb.y0/CH)), cy1=Math.min(Math.floor((W-1)/CH),Math.floor(vb.y1/CH));
  const list=[]; for(let cy=cy0;cy<=cy1;cy++)for(let cx=cx0;cx<=cx1;cx++) list.push([cx,cy]);
  list.sort((a,b)=>(a[0]+a[1])-(b[0]+b[1]));
  drawStormWall();
  for(const [cx,cy] of list){ const c=getChunk(cx,cy); if(c.empty) continue; const px=c.ox-cam.x+VW/2, py=c.oy-cam.y+VH/2; if(px>VW||py>VH||px+c.cv.width<0||py+c.cv.height<0) continue; ctx.drawImage(c.cv,Math.round(px),Math.round(py)); }
  // water shimmer + flat structs
  const drawables=[];
  for(let y=Math.max(0,vb.y0);y<=Math.min(W-1,vb.y1);y++)for(let x=Math.max(0,vb.x0);x<=Math.min(W-1,vb.x1);x++){
    const i=idx(x,y);
    const si=structGrid[i];
    if(si>=0){ const s=structs[si]; if(s.x===x&&s.y===y){ if(STRUCTS[s.type].flat) drawFlatStruct(s); else drawables.push({d:s.x+s.w/2+s.y+s.h/2-.2,k:1,o:s}); } }
    const di=decoGrid[i]; if(di>=0) drawables.push({d:x+y+1,k:2,o:decos[di]});
  }
  // telegraphs (ground)
  for(const e of effects) if(e.type==='tele') drawTele(e);
  for(const e of effects) if(e.type==='cloud') drawSporeCloud(e);
  if(G.buildMode) drawBuildGhost();
  for(const p of pickups) if(!p.taken) drawables.push({d:p.x+p.y,k:5,o:p});
  for(const n of npcs) drawables.push({d:n.x+n.y,k:3,o:n});
  for(const e of enemies) if(e.x>vb.x0-2&&e.x<vb.x1+2&&e.y>vb.y0-2&&e.y<vb.y1+2) drawables.push({d:e.x+e.y,k:4,o:e});
  if(P.alive) drawables.push({d:P.x+P.y,k:6,o:P});
  for(const p of projectiles) drawables.push({d:p.x+p.y,k:7,o:p});
  extraDrawables(drawables,vb);
  drawables.sort((a,b)=>a.d-b.d);
  for(const dr of drawables){
    switch(dr.k){case 1:drawStruct(dr.o);break;case 2:drawDeco(dr.o);break;case 3:drawNPC(dr.o);break;case 4:drawEnemy(dr.o);break;case 5:drawPickup(dr.o);break;case 6:drawPlayer();break;case 7:drawProjectile(dr.o);break;case 8:dr.f();break;}
  }
  drawParticles();
  drawGloom();
  for(const e of effects) if(e.type==='bolt') drawBolt(e);
  if(!(typeof inGround==='function'&&inGround(P.y))) for(const c of clouds){ if(c.layer===1) drawCloud(c,.9,.22-darkness()*.15); }
  drawLighting();
  drawStormWeather();
  for(const m of meteors) drawMeteor(m);
  // overlays above light
  for(const n of npcs) drawNPCLabel(n);
  for(const e of enemies) if(e.hp<e.maxHp||e.chief) drawEnemyBar(e);
  for(const c of camps) if(!c.cleared&&dist(c.x,c.y,P.x,P.y)<16) drawTotemBar(c.totem);
  drawTexts();
  ctx.restore();
  drawQuestArrow();
  if(flashRed>0){ ctx.fillStyle=`rgba(200,20,20,${flashRed*.35})`; ctx.fillRect(0,0,VW,VH); }
  const dk=darkness(); if(G.time>.58&&G.time<.72){ const a=Math.sin((G.time-.58)/.14*Math.PI)*.18; ctx.fillStyle=`rgba(255,120,40,${a})`; ctx.fillRect(0,0,VW,VH); }
  drawVignette();
}
function drawVignette(){ const g=ctx.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*.35,VW/2,VH/2,Math.max(VW,VH)*.75); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,30,.35)'); ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH); }

// --------- lighting
function drawLighting(){
  const d=darkness(); if(d<.02) return;
  lctx.setTransform(1,0,0,1,0,0); lctx.globalCompositeOperation='source-over'; lctx.clearRect(0,0,VW,VH);
  lctx.fillStyle=`rgba(6,8,30,${d})`; lctx.fillRect(0,0,VW,VH);
  lctx.globalCompositeOperation='destination-out';
  const L=(x,y,r,a)=>{ const [sx,sy]=S(x,y); const pr=r*44; if(sx<-pr||sx>VW+pr||sy<-pr||sy>VH+pr) return;
    lctx.save(); lctx.translate(sx,sy-10); lctx.scale(1,.62); const g=lctx.createRadialGradient(0,0,0,0,0,pr); g.addColorStop(0,`rgba(0,0,0,${a})`); g.addColorStop(.55,`rgba(0,0,0,${a*.7})`); g.addColorStop(1,'rgba(0,0,0,0)'); lctx.fillStyle=g; lctx.beginPath(); lctx.arc(0,0,pr,0,6.283); lctx.fill(); lctx.restore(); };
  if(P.alive) L(P.x,P.y,3.2,.85);
  for(const l of activeLights()) L(l.x,l.y,l.r*(.94+Math.sin(G.t*9+l.x)*.04),1);
  const xl=[]; extraLights(xl); for(const l of xl) L(l.x,l.y,l.r,.9);
  for(const p of projectiles) if(p.type==='orb'||p.type==='bolt') L(p.x,p.y,1.4,.7);
  for(const e of enemies) if(e.type==='warlord'||e.type==='stormguard') L(e.x,e.y,1.6,.5);
  const vb=viewBounds();
  for(let y=Math.max(0,vb.y0);y<=Math.min(W-1,vb.y1);y++)for(let x=Math.max(0,vb.x0);x<=Math.min(W-1,vb.x1);x++){ const di=decoGrid[idx(x,y)]; if(di<0) continue; const dd=decos[di]; if(dd.type==='glowcap'||dd.type==='shroomtree'||dd.type==='crystal'||dd.type==='glasstree') L(dd.x+.5,dd.y+.5,dd.type==='shroomtree'?1.8:1.2,.6); }
  ctx.drawImage(lightCv,0,0,VW,VH);
}
let lightCache=null, lightCacheT=0;
function activeLights(){
  if(lightCache && G.t-lightCacheT<.5) return lightCache;
  lightCache=[]; lightCacheT=G.t;
  const px=Math.floor(P.x),py=Math.floor(P.y); for(let y=Math.max(0,py-36);y<=Math.min(W-1,py+36);y++)for(let x=Math.max(0,px-36);x<=Math.min(W-1,px+36);x++){ const si=structGrid[idx(x,y)]; if(si<0) continue; const s=structs[si]; if(s.x!==x||s.y!==y) continue; const L=STRUCTS[s.type].light; if(L) lightCache.push({x:s.x+s.w/2,y:s.y+s.h/2,r:L,s}); }
  return lightCache;
}

// --------- decos
function drawDeco(d){
  let [x,y]=S(d.x+.5,d.y+.5); if(d.shake>0) x+=Math.sin(G.t*70)*d.shake*4;
  const v=d.v, g=ctx;
  switch(d.type){

// --------- helpers
function collides(x,y,r){ return blocked(Math.floor(x-r),Math.floor(y-r))||blocked(Math.floor(x+r),Math.floor(y-r))||blocked(Math.floor(x-r),Math.floor(y+r))||blocked(Math.floor(x+r),Math.floor(y+r)); }
function moveEnt(e,dx,dy,r){ let moved=0; const step=Math.max(Math.abs(dx),Math.abs(dy)); const n=Math.ceil(step/.2)||1;
  for(let i=0;i<n;i++){ const sx=dx/n, sy=dy/n; if(!collides(e.x+sx,e.y,r)){e.x+=sx;moved+=Math.abs(sx);} if(!collides(e.x,e.y+sy,r)){e.y+=sy;moved+=Math.abs(sy);} } return moved; }

// --------- player
function updatePlayer(dt){
  if(!P.alive) return;
  P.atkCd-=dt; P.bowCd-=dt; P.swing=Math.max(0,P.swing-dt); P.dodgeCd-=dt; P.iframes-=dt; P.hurt=Math.max(0,P.hurt-dt); P.healCd-=dt;
  let mx=0,my=0; const k=G.keys;
  if(k.w||k.arrowup){mx-=1;my-=1;} if(k.s||k.arrowdown){mx+=1;my+=1;} if(k.a||k.arrowleft){mx-=1;my+=1;} if(k.d||k.arrowright){mx+=1;my-=1;}
  const len=Math.hypot(mx,my); if(len){mx/=len;my/=len;P.lastDir={x:mx,y:my};}
  if(Math.abs(P.kx)+Math.abs(P.ky)>.05){ moveEnt(P,P.kx*dt,P.ky*dt,.28); const f=Math.pow(.002,dt); P.kx*=f; P.ky*=f; }
  if(P.dodgeT>0){ P.dodgeT-=dt; moveEnt(P,P.dvx*dt,P.dvy*dt,.28); if(Math.random()<.5) spawnParticle(P.x,P.y,.1,'#d8c8a8',3,{vz:.5}); }
  else { moveEnt(P,mx*4.4*dt,my*4.4*dt,.28); if(len) P.walk+=dt*12; }
  if((G.mouse.down||k[' ']) && !G.buildMode && !G.fishing && P.atkCd<=0) playerAttack();
  if((G.mouse.right||k.f) && !G.buildMode && P.bowCd<=0) playerShoot();
  // campfire healing + passive regen
  let heal=G.t-P.lastHit>8?.8:0;
  for(const l of activeLights()){ const st=STRUCTS[l.s.type].station; if(st==='campfire' && dist(l.x,l.y,P.x,P.y)<2.8){ heal+=5; if(Math.random()<.05&&P.hp<P.maxHp) spawnParticle(P.x,P.y,.8,'#7f7',3,{vz:1.5}); } }
  if(heal&&P.hp<P.maxHp) P.hp=Math.min(P.maxHp,P.hp+heal*dt);
  G.exploreT-=dt; if(G.exploreT<=0){ G.exploreT=.3; explore(P.x,P.y,12); }
}
function tryDodge(){
  if(!P.alive||P.dodgeCd>0||G.buildMode) return;
  let dx=P.lastDir.x, dy=P.lastDir.y; const k=G.keys; if(!(k.w||k.a||k.s||k.d||k.arrowup||k.arrowdown||k.arrowleft||k.arrowright)){ const w=screenToWorld(G.mouse.x,G.mouse.y); dx=w.x-P.x; dy=w.y-P.y; const l=Math.hypot(dx,dy)||1; dx/=l; dy/=l; }
  P.dodgeT=.28; P.iframes=.34; P.dvx=dx*11; P.dvy=dy*11; P.dodgeCd=.85; sfx('dodge');
}
function aimVec(){ const w=screenToWorld(G.mouse.x,G.mouse.y+16); let ax=w.x-P.x, ay=w.y-P.y; const l=Math.hypot(ax,ay)||1; return {x:ax/l,y:ay/l,wx:w.x,wy:w.y}; }
function playerAttack(){
  P.atkCd=.42; P.swing=.22; sfx('swing');
  const av=aimVec(), aa=Math.atan2(av.y,av.x); const dmg=weaponDmg(); let hit=false;
  for(const e of enemies){ if(e.spawnT>0) continue; const sz=ENEMIES[e.type].size*(e.chief?1.4:1); const d=dist(e.x,e.y,P.x,P.y);
    if(d<.8 || (d<1.45+sz*.35 && Math.abs(angDiff(Math.atan2(e.y-P.y,e.x-P.x),aa))<1.25)){ const crit=Math.random()<.12; damageEnemy(e,dmg*(crit?1.75:1)*rnd(.9,1.1),av.x,av.y,crit); hit=true; } }
  for(const s of structs){ if(!s.alive||s.type!=='totem') continue; const d=dist(s.x+.5,s.y+.5,P.x,P.y); if(d<2 && (d<1||Math.abs(angDiff(Math.atan2(s.y+.5-P.y,s.x+.5-P.x),aa))<1.3)){ hitTotem(s,dmg); hit=true; } }
  if(hit){ shake=Math.max(shake,.15); return; }
  let target=null; const tx=Math.floor(av.wx), ty=Math.floor(av.wy); const d0=decoAt(tx,ty);
  if(d0 && dist(tx+.5,ty+.5,P.x,P.y)<2.4) target=d0;
  else { let best=9; const px=Math.floor(P.x),py=Math.floor(P.y);
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){ const d=decoAt(px+dx,py+dy); if(!d) continue; const dd=dist(d.x+.5,d.y+.5,P.x,P.y);
      if(dd<1.9 && Math.abs(angDiff(Math.atan2(d.y+.5-P.y,d.x+.5-P.x),aa))<1.3 && dd<best){best=dd;target=d;} } }
  if(target) harvest(target);

function harvest(d){
  const def=DECO[d.type]; let pow=0;
  if(def.tool==='hand') pow=99; else if(def.tool==='axe') pow=axePow();
  else { if(pickTier()<def.tier){ floatText(d.x+.5,d.y+.5,def.tier===1?'Need a pickaxe!':def.tier===2?'Need a Stone Pickaxe':'Need an Iron Pickaxe','#ffb0a0',13); d.shake=.3; sfx('error'); return; } pow=pickPow(); }
  d.hp-=pow; if(!(d.shake>0)) shaking.push(d); d.shake=.25;
  const pc={axe:'#8a6038',pick:'#9a9aa0',hand:'#5aa040'}[def.tool]; burst(d.x+.5,d.y+.5,d.type==='crystal'?'#9ae8ff':d.type==='iron'?'#e08a3a':pc,5);
  sfx(def.tool==='pick'?'mine':def.tool==='axe'?'chop':'pluck');
  if(d.hp<=0){ let off=0;
    for(const k in def.drops){ if(k==='berries'&&!d.berries) continue; const [a,b]=def.drops[k]; const n=rndi(a,b); if(n>0){ give(k,n); texts.push({x:d.x+.5,y:d.y+.5,text:`+${n} ${ITEMS[k].i}`,col:'#fff',life:1.2+off,size:14}); off+=.25; } }
    removeDeco(d); if(def.regrow) regrowQ.push({type:d.type,x:d.x,y:d.y,t:def.regrow*rnd(.8,1.2)}); sfx('pickup');
  }
}

function quickHeal(){

function damagePlayer(dmg,sx,sy){

function spawnEnemy(type,x,y,o){

        if(best){ const dx=best.x-s.x-.5, dy=best.y-s.y-.5, l=Math.hypot(dx,dy)||1; s.data.aim=Math.atan2(isoY(dx,dy),isoX(dx,dy)); projectiles.push({x:s.x+.5,y:s.y+.5,vx:dx/l*16,vy:dy/l*16,dmg:18+P.lvl*2,from:'player',type:'bolt2',life:.8,r:.5}); s.data.cd=1.3; sfx('bow'); } } }
  }
}
function updateNPCs(dt){
  for(const n of npcs){
    const dp=dist(n.x,n.y,P.x,P.y); if(dp>45) continue;
    if(dp<3){ n.face=(P.x-n.x)-(P.y-n.y)>=0?1:-1; continue; }
    n.wt-=dt; if(n.wt<=0){ n.wt=rnd(2,6); const p={x:n.hx+rnd(-2,2),y:n.hy+rnd(-2,2)}; if(walkable(Math.floor(p.x),Math.floor(p.y))){n.tx=p.x;n.ty=p.y;} }
    const dx=n.tx-n.x, dy=n.ty-n.y, l=Math.hypot(dx,dy);
    if(l>.2){ const m=moveEnt(n,dx/l*1.2*dt,dy/l*1.2*dt,.25); if(m<.001){n.tx=n.x;n.ty=n.y;} n.walk=(n.walk||0)+dt*8; n.face=dx-dy>=0?1:-1; }
  }
}

// --------- world systems
// camps spawn their defenders only when the player is near (1000-island world)
function updateCamps(dt){
  G.campT-=dt; if(G.campT>0) return; G.campT=1;
  const byCamp={}; for(const e of enemies){ if(e.camp&&!e.dead) (byCamp[e.camp]=byCamp[e.camp]||[]).push(e); }
  for(const c of camps){
    if(c.cleared) continue;
    const dp=dist(P.x,P.y,c.x,c.y);
    if(!c.spawned){ if(dp<50) spawnCampAll(c); else continue; }
    if(dp>80){ despawnCamp(c); continue; }
    const alive=byCamp[c.key]||[];
    c.totem.data.shield=alive.length>0||(c.keep&&fortPostsLeft(c.fort)>0);
    const regular=alive.filter(e=>!e.chief).length;
    if(regular<c.count && dp>17){ c.respawnT+=1; if(c.respawnT>=25){ c.respawnT=0; spawnCampEnemy(c,regular); } }
  }
}
function spawnCampEnemy(c,i){ const p=nearestWalkable(c.x+rnd(-3,3),c.y+rnd(-3,3),4); spawnEnemy(c.types[i%c.types.length],p.x,p.y,{camp:c.key,noFade:true,mult:c.mult}); }
function spawnCampAll(c){
  c.spawned=true; c.totem.data.shield=true;
  for(let i=0;i<c.count;i++) spawnCampEnemy(c,i);
  if(c.chief && !c.chiefDead){ const p=nearestWalkable(c.x+1,c.y-1.5,3); spawnEnemy(c.chief,p.x,p.y,{camp:c.key,chief:true,name:c.chiefName,noFade:true,mult:c.mult,fortBoss:!!c.keep}); }
}
function despawnCamp(c){ c.spawned=false; for(const e of enemies) if(e.camp===c.key) e.dead=true; enemies=enemies.filter(e=>!e.dead); }
function initCampEnemies(){ for(const c of camps) c.spawned=false; G.campT=0; updateCamps(0); }
function updateNight(dt){
  if(!isNight()||G.day<2) return;
  G.nightT-=dt; if(G.nightT>0) return; G.nightT=Math.max(2.2,7-G.day*.4);
  const cap=Math.min(14,3+G.day); if(enemies.filter(e=>e.night).length>=cap) return;
  const lights=activeLights();
  for(let tr=0;tr<40;tr++){ const a=Math.random()*6.283, r=rnd(6.5,13); const x=P.x+Math.cos(a)*r, y=P.y+Math.sin(a)*r; const tx=Math.floor(x), ty=Math.floor(y);
    if(!inB(tx,ty)||!isLand(tx,ty)||!walkable(tx,ty)) continue;
    if(villages.some(v=>dist(v.x,v.y,x,y)<v.r+2)) continue;
    if(lights.some(l=>dist(l.x,l.y,x,y)<l.r)) continue;
    const isl=islands[islandOf[idx(tx,ty)]]; if(!isl||isl.boss) continue;

function updateRaid(dt){

function updateRegrow(dt){

function explore(x,y,r){
  let changed=false; const x0=Math.floor(x-r),x1=Math.ceil(x+r),y0=Math.floor(y-r),y1=Math.ceil(y+r);
  for(let yy=y0;yy<=y1;yy++)for(let xx=x0;xx<=x1;xx++){ if(!inB(xx,yy))continue; const i=idx(xx,yy); if(!explored[i]&&dist(xx,yy,x,y)<=r){explored[i]=1;changed=true; if(mapImg) paintMapPixel(i);} }
  if(changed){ growFog(x0,y0); growFog(x1,y1); }

// --------- interaction
function findInteract(){
  let best=null,bd=1.9;
  for(const n of npcs){ const d=dist(n.x,n.y,P.x,P.y); if(d<bd){bd=d;best={kind:'npc',o:n,label:`Talk to ${n.name}`};} }
  for(const p of pickups){ if(p.taken) continue; const d=dist(p.x,p.y,P.x,P.y); if(d<bd){bd=d;best={kind:'pickup',o:p,label:`Pick up ${p.name}`};} }
  const px=Math.floor(P.x), py=Math.floor(P.y);
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){ const s=structAt(px+dx,py+dy); if(!s) continue; const d=dist(s.x+s.w/2,s.y+s.h/2,P.x,P.y); if(d>=bd) continue;
    let label=null;
    if(s.type==='chest') label='Open chest';
    else if(s.type==='farm') label=!s.data.crop?((P.inv.seeds>0)?'Plant seeds':'Farm plot (needs seeds)'):(s.data.t>=90?'Harvest wheat':`Growing... ${Math.floor(s.data.t/90*100)}%`);
    else if(s.type==='bed') label=isNight()?'Sleep until morning':'Set respawn point';
    else if(s.type==='plinth') label='Inspect the Anchor Plinth';
    if(label){bd=d;best={kind:'struct',o:s,label};} }
  const gi=groundInteract(bd); if(gi){ best=gi; bd=gi.d; }
  const si=shrineInteract(bd); if(si){ best=si; bd=si.d; }
  const ex=extraInteract(bd); if(ex&&(ex.d<bd||!best)) best=ex;
  return best;
}
function doInteract(){
  if(!P.alive) return; const it=findInteract(); if(!it) return;
  if(it.kind==='extra') return it.fn();
  if(it.kind==='npc') return npcTalk(it.o);
  if(it.kind==='pickup'){ const p=it.o; p.taken=true; G.flags['pickup_'+p.id]=true; if(p.relic) collectRelic(p); else toast(`Picked up ${p.icon} ${p.name}`); sfx('pickup'); questEvent('pickup',{id:p.id}); return; }
  const s=it.o;
  if(s.type==='chest'){ const l=s.data.loot||{}; const parts=[]; for(const k in l){ give(k,l[k]); parts.push(`${l[k]} ${k==='coins'?'🪙':ITEMS[k].i}`);} removeStruct(s); sfx('coin'); burst(s.x+.5,s.y+.5,'#ffd040',16); toast('Loot: '+parts.join(', '),'gold'); if(s.data.camp) G.flags['chest_'+s.data.camp]=true; if(s.data.special) {G.flags[s.data.special]=true; questEvent('pickup',{id:s.data.special});} saveGame(); }
  else if(s.type==='farm'){ const c=s.data;
    if(!c.crop){ if(P.inv.seeds>0){ P.inv.seeds--; c.crop='wheat'; c.t=0; sfx('pluck'); floatText(s.x+.5,s.y+.5,'Planted!','#afa'); } else toast('You need seeds. Bushes sometimes drop them; merchants sell them.'); }
    else if(c.t>=90){ c.crop=null; c.t=0; give('wheat',3); const sd=rndi(0,2); if(sd) give('seeds',sd); floatText(s.x+.5,s.y+.5,`+3 🌾${sd?` +${sd} 🌱`:''}`,'#fff'); sfx('pickup'); questEvent('farm',{}); }
    else toast('Still growing. Crops take about 90 seconds.'); }
  else if(s.type==='bed'){ P.spawn=s.id; if(isNight()){ if(enemies.some(e=>dist(e.x,e.y,P.x,P.y)<10&&!e.dead)){ toast("You can't sleep with enemies nearby!"); return; } sleepNight(); } else toast('🛏 Respawn point set.'); }
  else if(s.type==='plinth') usePlinth();
}
function sleepNight(){
  const fade=document.getElementById('fade'); fade.classList.add('on');
  setTimeout(()=>{ G.time=.03; G.day++; P.hp=P.maxHp; enemies=enemies.filter(e=>!e.night); toast(`☀ Day ${G.day}. You feel rested.`); saveGame(); fade.classList.remove('on'); },700);
}
function usePlinth(){
  if(G.anchor){ toast('The Sky Anchor hums. The bridge to the storm holds.'); return; }
  const n=P.inv.shard||0;
  if(n<4){ toast(`The plinth has 4 sockets. You hold ${n} Sky Shard${n===1?'':'s'}.`); return; }
  if(!qActive('m10')){ toast('The shards hum... Seer Quill should hear about this first.'); return; }
  P.inv.shard-=4; G.anchor=true; buildSkybridge(); chunkCache.clear(); lightCache=null; shake=2; sfx('boom');
  burst(plinthPos.x,plinthPos.y,'#9ff0ff',50,4); toast('🌉 The Sky Anchor awakens! A bridge of light stretches to the Eye of the Storm.','gold');

}

// --------- building
function canPlace(type,tx,ty){
  const def=STRUCTS[type]; if(!inB(tx,ty)) return {ok:false,why:'Out of bounds'};
  if(dist(tx+.5,ty+.5,P.x,P.y)>6.2) return {ok:false,why:'Too far away'};
  if(def.req && !G.built[def.req]) return {ok:false,why:`Build a ${STRUCTS[def.req].n} first`};
  if(def.minLvl && P.lvl<def.minLvl) return {ok:false,why:`Requires level ${def.minLvl}`};
  if(!hasCost(def.cost)) return {ok:false,why:'Not enough materials'};
  const i=idx(tx,ty), t=tiles[i];
  if(structGrid[i]>=0) return {ok:false,why:'Occupied'};
  if(def.onVoid){
    if(t===T.SVOID) return {ok:false,why:inGround(ty)||ty>GROUND_Y-15?'The winds here tear planks apart':'The storm tears planks apart here'};
    if(t!==T.VOID) return {ok:false,why:'Bridges go over open sky'};
    const nb=[[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>{ const x=tx+dx,y=ty+dy; if(!inB(x,y)) return false; const tt=tiles[idx(x,y)]; if(!isVoidT(tt)&&tt!==T.WATER) return true; const s=structAt(x,y); return s&&STRUCTS[s.type].walk; });
    if(!nb) return {ok:false,why:'Must connect to land or a bridge'};
    return {ok:true};
  }
  if(isVoidT(t)||t===T.WATER) return {ok:false,why:'Needs solid ground'};
  const d=decoAt(tx,ty); if(d&&DECO[d.type].solid) return {ok:false,why:'Clear it first'};
  if(def.solid){ if(Math.abs(P.x-(tx+.5))<.8&&Math.abs(P.y-(ty+.5))<.8) return {ok:false,why:"You're standing there"}; if(enemies.some(e=>Math.abs(e.x-(tx+.5))<.7&&Math.abs(e.y-(ty+.5))<.7)) return {ok:false,why:'Blocked'}; }
  return {ok:true};
}
function placeStruct(){
  const type=BUILD_ORDER[G.buildSel]; const w=screenToWorld(G.mouse.x,G.mouse.y); const tx=Math.floor(w.x), ty=Math.floor(w.y);
  const r=canPlace(type,tx,ty); if(!r.ok){ floatText(tx+.5,ty+.5,r.why,'#ffb0a0',12); sfx('error'); return; }
  const d=decoAt(tx,ty); if(d) removeDeco(d);
  payCost(STRUCTS[type].cost); const s=addStruct(type,tx,ty,'player',type==='farm'?{crop:null,t:0}:{});
  if(type==='beacon'){ purify(tx+.5,ty+.5,20); toast('💠 The beacon flares. The gloom recoils!','gold'); }
  G.built[type]=true; G.stats.built++; lightCache=null; burst(tx+.5,ty+.5,'#d8c8a8',10); sfx('build');
  if(type==='bed'&&P.spawn==null) P.spawn=s.id;
  questEvent('build',{s:type}); updateBuildBar();
}
function demolish(){
  const w=screenToWorld(G.mouse.x,G.mouse.y); const s=structAt(Math.floor(w.x),Math.floor(w.y));
  if(!s||s.owner!=='player') return; if(dist(s.x+.5,s.y+.5,P.x,P.y)>6.2){ floatText(s.x+.5,s.y+.5,'Too far','#ffb0a0'); return; }
  if(STRUCTS[s.type].walk && s.type==='bridge' && Math.floor(P.x)===s.x && Math.floor(P.y)===s.y){ floatText(s.x+.5,s.y+.5,"You're standing on it!",'#ffb0a0'); return; }
  const c=STRUCTS[s.type].cost; for(const k in c){ const n=Math.floor(c[k]/2); if(n) give(k,n); }
  removeStruct(s); lightCache=null; if(s.type==='beacon') rebuildGloom(); burst(s.x+.5,s.y+.5,'#a87a4a',10); sfx('chop'); updateBuildBar();
}

function growFog(x,y){ if(!fogRect) fogRect=[x,y,x,y]; else { fogRect[0]=Math.min(fogRect[0],x); fogRect[1]=Math.min(fogRect[1],y); fogRect[2]=Math.max(fogRect[2],x); fogRect[3]=Math.max(fogRect[3],y); } fogDirty=true; }

// --------- sound
let AC=null, muted=false;
function sfx(type){
  if(muted) return;
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    const now=AC.currentTime;
    const tone=(f1,f2,dur,wave,vol,delay)=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type=wave||'square'; o.frequency.setValueAtTime(f1,now+(delay||0)); o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),now+(delay||0)+dur); g.gain.setValueAtTime(vol||.06,now+(delay||0)); g.gain.exponentialRampToValueAtTime(.0001,now+(delay||0)+dur); o.connect(g); g.connect(AC.destination); o.start(now+(delay||0)); o.stop(now+(delay||0)+dur+.02); };
    const noise=(dur,vol,hp)=>{ const b=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate); const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length); const s=AC.createBufferSource(); s.buffer=b; const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=hp||1200; const g=AC.createGain(); g.gain.value=vol||.12; s.connect(f); f.connect(g); g.connect(AC.destination); s.start(); };
    switch(type){
      case 'swing': noise(.08,.05,2400); break; case 'hit': tone(220,90,.1,'square',.06); noise(.06,.08,900); break;
      case 'chop': noise(.07,.12,700); tone(160,110,.06,'triangle',.05); break; case 'mine': noise(.06,.1,3000); tone(900,700,.05,'square',.03); break;
      case 'pluck': noise(.05,.06,1800); break; case 'pickup': tone(660,990,.08,'triangle',.05); break; case 'coin': tone(990,1480,.07,'square',.035); tone(1480,1980,.08,'square',.03,.06); break;
      case 'build': tone(200,140,.08,'square',.05); noise(.05,.08,600); break; case 'hurt': tone(300,80,.18,'sawtooth',.07); break;
      case 'error': tone(180,150,.12,'square',.04); break; case 'quest': [523,659,784,1046].forEach((f,i)=>tone(f,f,.14,'triangle',.06,i*.09)); break;
      case 'ready': tone(660,880,.1,'triangle',.05); tone(880,1100,.12,'triangle',.05,.08); break; case 'level': [392,523,659,784,1046].forEach((f,i)=>tone(f,f*1.01,.16,'square',.04,i*.07)); break;
      case 'bow': tone(500,200,.1,'triangle',.05); break; case 'throw': noise(.08,.05,1500); break; case 'dodge': noise(.12,.06,900); break;
      case 'eat': tone(300,500,.08,'triangle',.05); tone(400,600,.08,'triangle',.05,.09); break; case 'talk': tone(520,560,.05,'triangle',.04); break;
      case 'die': tone(400,60,.8,'sawtooth',.08); break; case 'boom': tone(120,30,.6,'sawtooth',.1); noise(.5,.2,300); break;
      case 'zap': noise(.15,.15,4000); tone(1200,200,.12,'sawtooth',.05); break; case 'slam': tone(90,40,.25,'sine',.15); noise(.2,.12,400); break;
      case 'charge': tone(300,900,.5,'sawtooth',.03); break; case 'dash': noise(.15,.08,1200); break;
    }
  }catch(e){}
}

      if(r.qty>1) ds+=` · Makes ${r.qty}`; if(r.minLvl) ds+=` · <span style="color:${P.lvl>=r.minLvl?'#6fe08a':'#ff7a7a'}">Requires level ${r.minLvl}</span>`;

    const sec=(title,filter,use)=>{ const ks=Object.keys(P.inv).filter(k=>P.inv[k]>0&&ITEMS[k]&&filter(ITEMS[k],k)); if(!ks.length) return ''; let s=`<h3>${title}</h3><div class="inv">`;
      for(const k of ks){ const it=ITEMS[k]; s+=`<div class="slot ${eq.includes(k)?'eq':''}"><span class="big">${it.i}</span><div style="flex:1"><div style="font-weight:700">${it.n}</div><div style="color:#9aa8cc">${it.gear?(eq.includes(k)?'Equipped':'Spare'):'x'+P.inv[k]}${it.heal?` · heals ${it.heal}`:''}</div></div>${use&&it.heal?`<button class="btn" onclick="useItem('${k}');renderPanel()">Use</button>`:''}</div>`; } return s+'</div>'; };

    b.innerHTML=h;
  } else if(panelOpen==='quests'){
    t.textContent='Quest Log'; let h='';
    const act=activeQuests(); const tq=trackedQuest();
    h+='<h3>Active</h3>'; if(!act.length) h+='<div style="color:#9aa8cc">No active quests. Look for <b style="color:#f2c94c">!</b> above villagers.</div>';
    for(const q of act){ const st=qs[q.id]; h+=`<div class="ql ${tq&&tq.id===q.id?'tr':''}"><div class="k">${q.kind==='tut'?'TUTORIAL':q.kind==='main'?'⭐ MAIN':'SIDE'}${st.st==='ready'?' · READY TO TURN IN':''}</div><div class="t">${q.title}</div>`;
      q.obj.forEach((o,i)=>{ const [c,n]=objProgress(q,i); h+=`<div style="font-size:13px;color:${c>=n?'#6fe08a':'#d8e0ff'}">${c>=n?'✔':'•'} ${objText(q,i)}</div>`; });

      h+=`<button class="btn alt" style="margin-top:6px;font-size:12px" onclick="G.tracked='${q.id}';tgtCache.t=-9;renderPanel();updateTracker()">Track</button></div>`; }
    const gpos=q=>{ const g=npcs.find(n=>n.id===q.giver); return g?dist(g.x,g.y,P.x,P.y):1e9; };
    const allAvail=QUESTS.filter(q=>q.giver&&!qs[q.id]&&preMet(q)).sort((a,b)=>gpos(a)-gpos(b)); const avail=allAvail.slice(0,8);
    if(avail.length){ h+=`<h3>Available nearby${allAvail.length>8?` (${allAvail.length} in the world)`:''}</h3>`; for(const q of avail){ const g=npcs.find(n=>n.id===q.giver); const isl=islandByKey[g.isl]; h+=`<div class="ql"><div class="k">${q.kind==='main'?'⭐ MAIN':'SIDE'}</div><div class="t">${q.title}</div><div style="font-size:13px;color:#9aa8cc">Talk to ${g.name} (${isl.vill?isl.vill.name:isl.name}, ${Math.round(dist(g.x,g.y,P.x,P.y))}m ${compassDir(g.x-P.x,g.y-P.y)})</div></div>`; } }
    const done=QUESTS.filter(q=>qDone(q.id)); if(done.length){ h+=`<h3>Completed (${done.length}/${QUESTS.length})</h3><div style="font-size:13px;color:#9aa8cc">${done.map(q=>q.title).join(' · ')}</div>`; }

  } else if(panelOpen==='map'){

    const w=Math.min(820,window.innerWidth*.9-40), h=Math.min(520,window.innerHeight*.86-150);
    b.innerHTML=`<canvas id="bigmap" width="${w}" height="${h}" style="cursor:grab"></canvas><div class="legend"><span>🟡 You</span><span>🏠 Village</span><span style="color:#ff7a7a">☠ Camp</span><span>🏰 Boss fortress</span><span>🌀 Wind Shrine</span><span>✔ Cleared</span><span style="color:#f2c94c">★ Quest target</span><span>Scroll to zoom · drag to pan · <a href="#" id="bmCenter" style="color:#9ad0ff">center on me</a></span></div>`;
    if(!tab||!BM.init){ BM.cx=P.x; BM.cy=P.y; BM.s=1.6; BM.init=true; }
    const cv=$('bigmap'); const redraw=()=>drawMap(cv,BM.cx,BM.cy,BM.s,true); redraw();
    cv.onwheel=e=>{ e.preventDefault(); BM.s=clamp(BM.s*(e.deltaY<0?1.2:1/1.2),.35,8); redraw(); };
    let drag=null; cv.onmousedown=e=>{ drag={x:e.clientX,y:e.clientY}; };
    cv.onmousemove=e=>{ if(!drag) return; const X=e.clientX-drag.x, Y=e.clientY-drag.y; drag={x:e.clientX,y:e.clientY}; const a=X/(.7071*BM.s), bb=Y/(.3536*BM.s); BM.cx-=(a+bb)/2; BM.cy-=(bb-a)/2; redraw(); };
    cv.onmouseup=cv.onmouseleave=()=>{ drag=null; };
    $('bmCenter').onclick=e=>{ e.preventDefault(); BM.cx=P.x; BM.cy=P.y; redraw(); };
  } else if(panelOpen==='shop'){

function costHTML(c){ return Object.keys(c).map(k=>`<span class="${cnt(k)>=c[k]?'ok':'no'}">${k==='coins'?'🪙':ITEMS[k].i} ${cnt(k)}/${c[k]}</span>`).join(''); }
function nearStation(st){ if(st==='hand') return true; for(const s of structs){ if(s.alive&&STRUCTS[s.type].station===st&&dist(s.x+.5,s.y+.5,P.x,P.y)<3.6) return true; } return false; }
function craft(id){
  const r=RECIPES.find(r=>r.id===id); if(!r||!hasCost(r.cost)||!nearStation(r.st)||(r.minLvl&&P.lvl<r.minLvl)) return; const it=ITEMS[id]; if(it.gear&&P.inv[id]>0) return;
  payCost(r.cost); give(id,r.qty||1); sfx('build'); toast(`Crafted ${it.i} ${it.n}${r.qty>1?' x'+r.qty:''}`); checkQuests(); renderPanel();
}
function buy(i){ const s=SHOP.buy[i]; if(P.coins<s.p) return; P.coins-=s.p; give(s.it,s.q); sfx('coin'); renderPanel(); }
function sell(k,n){ n=Math.min(n,P.inv[k]||0); if(n<=0) return; P.inv[k]-=n; P.coins+=n*ITEMS[k].sell; sfx('coin'); renderPanel(); }

// --------- map
const MAP_COL={[T.GRASS]:[110,180,80],[T.SAND]:[220,200,140],[T.BLOOM]:[220,150,190],[T.MOSS]:[120,96,160],[T.CRYST]:[150,210,230],[T.STORM]:[90,96,116],[T.PATH]:[200,168,116],[T.WATER]:[70,150,210]};
function paintMapPixel(i){
  const d=mapImg.data; d[i*4+3]=0; if(!explored[i]) return; const t=tiles[i]; let c=MAP_COL[t];
  const si=structGrid[i]; if(si>=0){ const ty=structs[si].type; if(ty==='bridge') c=[170,120,74]; else if(ty==='skybridge') c=[127,232,255]; else if(ty==='house') c=[230,220,190]; }
  if(!c){ if(t===T.SVOID){ d[i*4]=60;d[i*4+1]=70;d[i*4+2]=120;d[i*4+3]=90; } return; }
  if(decoGrid[i]>=0&&DECO[decos[decoGrid[i]].type].solid) c=[c[0]*.75,c[1]*.75,c[2]*.75];
  d[i*4]=c[0];d[i*4+1]=c[1];d[i*4+2]=c[2];d[i*4+3]=255;
}
function rebuildMap(){
  if(!mapImg) mapImg=mapG.createImageData(W,W);
  for(let i=0;i<W*W;i++) paintMapPixel(i);
  mapG.putImageData(mapImg,0,0); mapDirty=false; fogDirty=false; fogRect=null;
}
function flushFog(){ if(!fogRect){ fogDirty=false; return; } const [x0,y0,x1,y1]=fogRect; mapG.putImageData(mapImg,0,0,Math.max(0,x0-1),Math.max(0,y0-1),x1-x0+3,y1-y0+3); fogRect=null; fogDirty=false; }
function drawMap(cv,cx,cy,s,big){
  if(mapDirty) rebuildMap(); else if(fogDirty) flushFog();
  const g=cv.getContext('2d'), w=cv.width, h=cv.height; g.clearRect(0,0,w,h);
  g.save(); g.translate(w/2,h/2); g.scale(s,s*.5); g.rotate(Math.PI/4); g.translate(-cx,-cy); g.imageSmoothingEnabled=false; g.drawImage(mapCv,0,0); g.restore();
  const mp=(x,y)=>{ const dx=x-cx, dy=y-cy; return [w/2+(dx-dy)*.7071*s, h/2+(dx+dy)*.7071*s*.5]; };
  const ex=(x,y)=>explored[idx(clamp(Math.floor(x),0,W-1),clamp(Math.floor(y),0,W-1))];
  g.textAlign='center'; g.textBaseline='middle';
  const onC=(x,y)=>x>-20&&y>-20&&x<w+20&&y<h+20;
  for(const v of villages){ if(!ex(v.x,v.y)) continue; const [x,y]=mp(v.x,v.y); if(!onC(x,y)) continue; g.font=(big?18:13)+'px serif'; g.fillText('🏠',x,y); if(big&&s>=1.1){ g.font='bold 12px system-ui'; g.fillStyle='#fff'; g.strokeStyle='#000'; g.lineWidth=3; g.strokeText(v.name,x,y+16); g.fillText(v.name,x,y+16);} }

function genExtras(r){
  critters=[]; balloons=[]; meteors=[]; petEnt=null;
  const wild=islands.filter(i=>i.kind==='res'&&i.r>=5);
  for(const isl of wild){ if(r()<.25){ const type=Object.keys(PETS).find(k=>PETS[k].biomes.includes(isl.biome)); if(!type) continue; const p=nearestWalkable(isl.x+1,isl.y,4); critters.push({type,x:p.x,y:p.y,hx:p.x,hy:p.y,wt:0,tx:p.x,ty:p.y,walk:0,face:1}); } }
  for(const [k,type] of [['windmere','fox'],['honey','bunny']]){ const isl=islandByKey[k]; const p=nearestWalkable(isl.x+2,isl.y-2,4); critters.push({type,x:p.x,y:p.y,hx:p.x,hy:p.y,wt:0,tx:p.x,ty:p.y,walk:0,face:1}); }
  // relics spread across wild islands, sorted so every danger level has some
  const cand=islands.filter(i=>i.kind==='res'&&i.r>=4&&!i.treasure).map(i=>({i,k:r()})).sort((a,b)=>a.k-b.k).map(o=>o.i);
  let n=0; for(const isl of cand){ if(n>=RELIC_TOTAL) break; if(n<8&&isl.tier>2) continue; const p=nearestWalkable(isl.x,isl.y,3); if(!isLand(Math.floor(p.x),Math.floor(p.y))) continue;
    pickups.push({id:'relic_'+n,name:`${RELIC_ADJ[n%RELIC_ADJ.length]} ${RELIC_NOUN[(n*7)%RELIC_NOUN.length]}`,icon:'🏺',x:p.x,y:p.y,taken:false,relic:true}); n++; }
  // bounty board in every village
  for(const v of villages){ const cx=Math.floor(v.x), cy=Math.floor(v.y); for(const [dx,dy] of [[3,-4],[4,3],[-4,-3],[2,5],[-5,1]]){ if(footprintFree(cx+dx,cy+dy,1,1)){ addStruct('board',cx+dx,cy+dy,'world',{village:v.key}); break; } } }
}
